<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>AI Prompt Cache Management</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">    <th:block th:replace="~{fragments/theme-css :: themeCss}" />
</head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <h2>AI Prompt Cache Management</h2>
        <p>View, search, and manage cached AI prompts. Each cache entry shows the prompt, provider, hit count, and usage
            timestamps.</p>

        <div id="messageContainer"></div>

        <div class="cache-stats">
            <div class="stat-box">
                <div class="stat-label">Total Cached Prompts</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Cache Hits</div>
                <div class="stat-value" id="totalHits">0</div>
            </div>
        </div>

        <div class="cache-controls">
            <button class="btn-action" onclick="reloadCache()">Refresh</button>
            <button class="btn-danger" onclick="confirmClearAll()">Clear All Cache</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search in prompts..." onkeyup="filterTable()">
        </div>

        <div id="loadingContainer" class="loading d-none">
            <div class="spinner"></div>
            <p>Loading cache entries...</p>
        </div>

        <div id="cacheTableContainer"></div>
    </div>

    <!-- Detail View Modal -->
    <div id="detailModal" class="modal-bg">
        <div class="modal-popup">
            <div class="modal-header">
                <h2>Cache Entry Details</h2>
                <button class="btn-cancel" onclick="closeDetailModal()">Close</button>
            </div>
            <div id="detailContent"></div>
            <div class="modal-btn-row">
                <button class="btn-cancel" onclick="closeDetailModal()">Close</button>
                <button class="btn-danger" onclick="deleteFromModal()">Delete Entry</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

        let cachedData = [];
        let selectedEntryId = null;

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function showMessage(message, type = 'success') {
            const container = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type} show`;
            messageDiv.textContent = message;
            container.innerHTML = '';
            container.appendChild(messageDiv);
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }

        function reloadCache() {
            showLoading(true);
            fetch('/config/ai-cache/list')
                .then(response => response.json())
                .then(data => {
                    showLoading(false);
                    if (data.success) {
                        cachedData = data.entries;
                        renderCacheTable();
                        updateStats();
                    } else {
                        showMessage('Error loading cache: ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    showLoading(false);
                    showMessage('Error: ' + error.message, 'error');
                });
        }

        function updateStats() {
            const totalCount = cachedData.length;
            const totalHits = cachedData.reduce((sum, entry) => sum + (entry.hitCount || 0), 0);
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('totalHits').textContent = totalHits;
        }

        function renderCacheTable() {
            const container = document.getElementById('cacheTableContainer');

            if (cachedData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No cached prompts yet.</p>
                        <small>Cache entries will appear here after you make AI requests.</small>
                    </div>
                `;
                return;
            }

            let tableHtml = `
                <div class="cache-table-wrapper">
                    <table class="cache-table" id="cacheTable">
                        <thead>
                            <tr>
                                <th>Prompt</th>
                                <th>Provider</th>
                                <th>Hits</th>
                                <th>Created</th>
                                <th>Last Used</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            cachedData.forEach(entry => {
                const promptPreview = entry.prompt.length > 50
                    ? entry.prompt.substring(0, 50) + '...'
                    : entry.prompt;

                tableHtml += `
                    <tr class="cache-row">
                        <td class="prompt-cell" title="${escapeHtml(entry.prompt)}" onclick="viewDetails(${entry.id})">
                            ${escapeHtml(promptPreview)}
                        </td>
                        <td><span class="provider-badge">${escapeHtml(entry.providerName)}</span></td>
                        <td><span class="hit-count-badge">${entry.hitCount}</span></td>
                        <td>${formatDate(entry.createdAt)}</td>
                        <td>${formatDate(entry.lastUsed)}</td>
                        <td>
                            <button class="btn-action" onclick="viewDetails(${entry.id})">View</button>
                            <button class="btn-danger" onclick="deleteEntry(${entry.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('.cache-row');

            rows.forEach(row => {
                const promptCell = row.querySelector('.prompt-cell');
                const text = promptCell.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        function viewDetails(id) {
            const entry = cachedData.find(e => e.id === id);
            if (!entry) return;

            selectedEntryId = id;
            const detailContent = document.getElementById('detailContent');

            detailContent.innerHTML = `
                <div class="cache-details">
                    <div class="cache-detail-row">
                        <div class="detail-label">Prompt</div>
                        <div class="detail-value">${escapeHtml(entry.prompt)}</div>
                    </div>
                    <div class="cache-detail-row">
                        <div class="detail-label">Response</div>
                        <div class="detail-value">${escapeHtml(entry.response)}</div>
                    </div>
                    <div class="cache-detail-row">
                        <div class="detail-label">Provider</div>
                        <div class="detail-value">${escapeHtml(entry.providerName)}</div>
                    </div>
                    <div class="cache-detail-row">
                        <div class="detail-label">Cache Hits</div>
                        <div class="detail-value">${entry.hitCount}</div>
                    </div>
                    <div class="cache-detail-row">
                        <div class="detail-label">Created At</div>
                        <div class="detail-value">${formatDate(entry.createdAt)}</div>
                    </div>
                    <div class="cache-detail-row">
                        <div class="detail-label">Last Used</div>
                        <div class="detail-value">${formatDate(entry.lastUsed)}</div>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
            selectedEntryId = null;
        }

        function deleteEntry(id) {
            const headers = new Headers();
            if (csrfToken) {
                headers.append(csrfHeader, csrfToken);
            }

            fetch(`/config/ai-cache/${id}`, {
                method: 'DELETE',
                headers: headers
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Cache entry deleted successfully', 'success');
                        reloadCache();
                    } else {
                        showMessage('Error deleting entry: ' + data.error, 'error');
                    }
                })
                .catch(error => showMessage('Error: ' + error.message, 'error'));

        }

        function deleteFromModal() {
            if (selectedEntryId) {
                const idToDelete = selectedEntryId;
                closeDetailModal();
                deleteEntry(idToDelete);
            }
        }

        function confirmClearAll() {
            if (confirm('Are you sure you want to clear ALL cache entries? This action cannot be undone.')) {
                const headers = new Headers();
                if (csrfToken) {
                    headers.append(csrfHeader, csrfToken);
                }
                headers.append('Content-Type', 'application/json');

                fetch('/config/ai-cache/clear-all', {
                    method: 'POST',
                    headers: headers,
                    body: '{}'
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showMessage('All cache entries cleared successfully', 'success');
                            reloadCache();
                        } else {
                            showMessage('Error clearing cache: ' + data.error, 'error');
                        }
                    })
                    .catch(error => showMessage('Error: ' + error.message, 'error'));
            }
        }

        function showLoading(show) {
            document.getElementById('loadingContainer').style.display = show ? 'block' : 'none';
        }

        // Close modal when clicking outside
        document.getElementById('detailModal').addEventListener('click', function (event) {
            if (event.target === this) {
                closeDetailModal();
            }
        });

        // Load cache on page load
        reloadCache();
    </script>
</body>

</html>
