<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Create Assessment</title>
    <meta charset="UTF-8"></head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <h1>Create Assessment</h1>

        <form th:action="@{/assessment/create}" method="post" id="createAssessmentForm">
            <div style="max-width:800px;">
                <!-- Row 1: Name + Catalog side by side -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Assessment Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter assessment name">
                        <span id="nameError" class="form-error d-none">Please enter an assessment name.</span>
                    </div>
                    <div class="form-group">
                        <label for="catalog">Security Catalog</label>
                        <select id="catalog" name="catalogId" required>
                            <option value="" disabled selected>-- Select a Catalog --</option>
                            <option th:each="catalog: ${catalogs}"
                                    th:value="${catalog.id}"
                                    th:text="${catalog.name}"></option>
                        </select>
                        <span id="catalogError" class="form-error d-none">Please select a catalog.</span>
                    </div>
                </div>

                <!-- Org Unit Selection -->
                <div class="form-group">
                    <label>Organizational Unit</label>
                    <input type="hidden" id="orgUnitId" name="orgUnitId" required>
                    <div style="display:flex;gap:1em;align-items:center;">
                        <button type="button" id="openOrgUnitModal" class="btn-action">Select Org Unit</button>
                        <span id="selectedOrgUnitName" class="text-muted">No org unit selected</span>
                    </div>
                    <span id="orgUnitError" class="form-error d-none">Please select an organizational unit.</span>
                </div>

                <!-- Row 2: Org Services + Users side by side -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="orgService">Organizational Services</label>
                        <select name="orgServiceIds" id="orgService" multiple style="min-height:120px;">
                            <option th:each="orgService : ${orgServices}"
                                    th:value="${orgService.id}"
                                    th:text="${orgService.name}"></option>
                        </select>
                        <span class="help-text">Hold Ctrl/Cmd to select multiple</span>
                    </div>
                    <div class="form-group">
                        <label for="users">Assign Users</label>
                        <select name="userIds" id="users" multiple style="min-height:120px;">
                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name + ' (' + user.email + ')'}"></option>
                        </select>
                        <span class="help-text">Hold Ctrl/Cmd to select multiple</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Create Assessment</button>
                </div>
            </div>
        </form>

        <!-- Org Unit Modal -->
        <div id="orgUnitModal" class="modal-bg" style="display:none;" aria-hidden="true">
            <div class="modal-popup" style="max-height:70vh;display:flex;flex-direction:column;width:420px;">
                <div class="modal-header-row">
                    <h3 class="m-0">Choose Organizational Unit</h3>
                    <button type="button" id="closeOrgUnitModal" class="btn-cancel">Close</button>
                </div>
                <input type="text" id="orgUnitSearch" placeholder="Filter org units by name..." class="modal-search-input" style="width:100%;margin:0.7em 0;flex-shrink:0;" />
                <ul id="orgUnitList" class="list-unstyled" style="max-height:25vh;min-height:25vh;overflow-y:auto;margin:0;padding:0;">
                    <li th:each="orgUnit : ${orgUnits}" th:attr="data-id=${orgUnit.id}" th:text="${orgUnit.name}" class="org-unit-list-item" onclick="selectOrgUnit(this)"></li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var modal = document.getElementById('orgUnitModal');
            var openBtn = document.getElementById('openOrgUnitModal');
            var closeBtn = document.getElementById('closeOrgUnitModal');
            var searchInput = document.getElementById('orgUnitSearch');
            var list = document.getElementById('orgUnitList');
            var hiddenInput = document.getElementById('orgUnitId');
            var selectedName = document.getElementById('selectedOrgUnitName');

            if(openBtn){
                openBtn.addEventListener('click', function(){
                    modal.style.display = 'flex';
                    modal.setAttribute('aria-hidden','false');
                    searchInput.value = '';
                    filterList('');
                    searchInput.focus();
                });
            }
            if(closeBtn){
                closeBtn.addEventListener('click', function(){
                    modal.style.display = 'none';
                    modal.setAttribute('aria-hidden','true');
                });
            }
            modal.addEventListener('click', function(e){
                if(e.target === modal){
                    modal.style.display = 'none';
                    modal.setAttribute('aria-hidden','true');
                }
            });
            document.addEventListener('keydown', function(e){
                if(e.key === 'Escape' && modal.style.display === 'flex'){
                    modal.style.display = 'none';
                    modal.setAttribute('aria-hidden','true');
                }
            });
            function filterList(term){
                term = (term || '').toLowerCase();
                list.querySelectorAll('li').forEach(function(li){
                    li.style.display = li.textContent.toLowerCase().indexOf(term) !== -1 ? '' : 'none';
                });
            }
            searchInput.addEventListener('input', function(){ filterList(this.value); });
            window.selectOrgUnit = function(el){
                hiddenInput.value = el.getAttribute('data-id');
                selectedName.textContent = el.textContent || el.innerText;
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden','true');
            };
        })();

        (function(){
            var form = document.getElementById('createAssessmentForm');
            if(!form) return;
            var nameInput = document.getElementById('name');
            var catalog = document.getElementById('catalog');
            var orgUnitId = document.getElementById('orgUnitId');
            var nameError = document.getElementById('nameError');
            var catalogError = document.getElementById('catalogError');
            var orgUnitError = document.getElementById('orgUnitError');

            function clearErrors(){
                [nameError,catalogError,orgUnitError].forEach(function(el){ if(el) el.style.display='none'; });
                if(catalog) catalog.classList.remove('input-error');
                if(nameInput) nameInput.classList.remove('input-error');
                var sel = document.getElementById('selectedOrgUnitName');
                if(sel) sel.classList.remove('input-error');
            }

            form.addEventListener('submit', function(e){
                clearErrors();
                var valid = true;
                if(!nameInput || !nameInput.value.trim()){
                    if(nameError) nameError.style.display='block';
                    if(nameInput) nameInput.classList.add('input-error');
                    valid = false;
                }
                if(!catalog || !catalog.value || catalog.selectedIndex === 0){
                    if(catalogError) catalogError.style.display='block';
                    if(catalog) catalog.classList.add('input-error');
                    valid = false;
                }
                if(!orgUnitId || !orgUnitId.value.trim()){
                    if(orgUnitError) orgUnitError.style.display='block';
                    var sel = document.getElementById('selectedOrgUnitName');
                    if(sel) sel.classList.add('input-error');
                    valid = false;
                }
                if(!valid){
                    e.preventDefault();
                    if(!nameInput.value.trim()) nameInput.focus();
                    else if(!catalog.value) catalog.focus();
                    else document.getElementById('openOrgUnitModal').focus();
                }
            });
        })();
    </script>
</body>
</html>
