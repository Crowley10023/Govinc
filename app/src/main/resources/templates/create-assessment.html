<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Create Assessment</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <div class="orgservice-header">
            <h1>Create Assessment</h1>
        </div>
        
        <form th:action="@{/assessment/create}" method="post" class="create-assessment-form">
            <div class="card">
                <div class="card-body">
                    <!-- Assessment Name -->
                    <div class="card-section">
                        <label for="name">Assessment Name (Optional)</label>
                        <input type="text" id="name" name="name" class="form-control-input" placeholder="Enter assessment name">
                    </div>

                    <!-- Catalog Selection -->
                    <div class="card-section">
                        <label for="catalog">Security Catalog</label>
                        <select id="catalog" name="catalogId" required class="form-control-select">
                            <option disabled selected>-- Select a Catalog --</option>
                            <option th:each="catalog: ${catalogs}" 
                                    th:value="${catalog.id}" 
                                    th:text="${catalog.name}"></option>
                        </select>
                    </div>

                    <!-- Org Unit Selection -->
                    <div class="card-section">
                        <label for="orgUnit">Organizational Unit</label>
                        <select id="orgUnit" name="orgUnitId" required class="form-control-select">
                            <option value="" disabled selected>-- Select an Org Unit --</option>
                            <option th:each="orgUnit : ${orgUnits}"
                                    th:value="${orgUnit.id}"
                                    th:text="${orgUnit.name}"></option>
                        </select>
                    </div>

                    <!-- Org Services Selection -->
                    <div class="card-section">
                        <label for="orgService">Organizational Services</label>
                        <select name="orgServiceIds" id="orgService" multiple class="form-control-select">
                            <option th:each="orgService : ${orgServices}"
                                    th:value="${orgService.id}"
                                    th:text="${orgService.name}"></option>
                        </select>
                        <p class="form-hint">(Hold Ctrl or Cmd to select multiple services)</p>
                    </div>

                    <!-- Users Selection -->
                    <div class="card-section">
                        <label for="users">Assign Users</label>
                        <select name="userIds" id="users" multiple class="form-control-select">
                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name + ' (' + user.email + ')'}"></option>
                        </select>
                        <p class="form-hint">(Hold Ctrl or Cmd to select multiple users)</p>
                    </div>
                </div>

                <div class="card-actions">
                    <button type="submit" class="btn-action btn-create-primary">Create Assessment</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
