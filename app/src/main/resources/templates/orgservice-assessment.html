<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Org Service Assessment</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <div class="assessment-header">
            <h1>Org Service Assessment</h1>
            <h2 th:text="${assessment.orgService.name}"></h2>
            <div class="info-message">
                <strong>Number of applicable maturity answers:</strong> <span class="stat-number"
                    th:text="${applicableCount}"></span>
            </div>
        </div>

        <!-- Show error message if present -->
        <div th:if="${errorMsg}" class="error-message">
            <span th:text="${errorMsg}"></span>
        </div>

        <form id="assessmentForm">
            <input type="hidden" name="id" th:value="${assessment.id}" />
            <input type="hidden" name="orgServiceId" th:value="${assessment.orgService.id}" />
            <input type="hidden" name="assessmentDate" th:value="${assessment.assessmentDate}" />

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="filterText">Search by Title or Description</label>
                        <input type="search" id="filterText" placeholder="Type to filter controls..." />
                    </div>

                    <div class="filter-group">
                        <label for="maturityModelSelect">Maturity Model (for answering ease)</label>
                        <select id="maturityModelSelect">
                            <option value="">-- Select a model --</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filterCatalog">Security Catalog</label>
                        <select id="filterCatalog">
                            <option value="">-- All catalogs --</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <div class="filter-checkbox-group">
                            <input type="checkbox" id="hideRatedByAnother" />
                            <label for="hideRatedByAnother">Hide rated by another</label>
                        </div>                        
                        <div class="filter-checkbox-group">
                            <input type="checkbox" id="filterRated" />
                            <label for="filterRated">Only applicable</label>
                        </div>
                    </div>

                </div>

                <div class="filter-stats">
                    <div class="filter-stat-item">
                        <span>Showing:</span>
                        <span class="stat-number"><span id="visibleCount" th:text="${controls.size()}"></span>/<span
                                th:text="${controls.size()}"></span></span>
                    </div>
                    <div class="filter-stat-item">
                        <button type="button" id="clearFiltersBtn" class="btn-cancel">Clear Filters</button>
                    </div>
                </div>
            </div>

            <!-- Controls Table -->
            <div class="form-table-wrapper">
                <table class="controls-table">
                    <thead>
                        <tr>
                            <th>Security Control</th>
                            <th class="w-150">Applicable</th>
                            <th class="w-120">Percent</th>
                            <th class="w-250">Comment</th>
                        </tr>
                    </thead>
                    <tbody id="controlsTableBody">
                        <tr th:each="control,stat : ${controls}"
                            th:attr="data-control-id=${control.securityControl.id},data-catalog-id=${#lists.isEmpty(control.securityControl.securityCatalogs) ? '' : control.securityControl.securityCatalogs.iterator().next().id}"
                            class="control-row">
                            <td>
                                <div class="control-name" th:text="${control.securityControl.name}"></div>
                                <div class="control-detail" th:text="${control.securityControl.detail}"></div>
                            </td>
                            <td>
                                <input type="checkbox" class="control-checkbox control-applicable"
                                    th:value="${control.securityControl.id}" th:checked="${control.applicable}"
                                    th:disabled="${control.answeredByAnotherAssessment}" />
                                <div class="linked-service-info" th:if="${control.answeredByAnotherAssessment}">
                                    <b th:text="${control.answeredByOrgServiceName}"></b>
                                </div>
                            </td>
                            <td>
                                <input type="number" min="0" max="100" class="control-input control-percent"
                                    th:value="${control.percent}" required
                                    th:disabled="${control.answeredByAnotherAssessment}" />
                                <select class="control-select control-answer d-none"
                                    th:disabled="${control.answeredByAnotherAssessment}"></select>
                            </td>
                            <td>
                                <textarea class="control-comment"
                                    th:attr="data-control-id=${control.securityControl.id},data-catalog-id=${#lists.isEmpty(control.securityControl.securityCatalogs) ? '' : control.securityControl.securityCatalogs.iterator().next().id}"
                                    placeholder="Add comment (optional)"
                                    th:disabled="${control.answeredByAnotherAssessment}"
                                    th:text="${control.comment}"></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="noResults" class="no-results d-none">
                    No security controls match your filters.
                </div>
            </div>

            <!-- Button Group -->
            <div class="form-actions">
                <a th:href="@{/orgservices/list}" class="btn-cancel">Back to Org Services</a>
            </div>
        </form>
    </div>

    <!-- Save Notification -->
    <div id="saveNotification" class="save-notification">
        <span class="checkmark">✓</span>
        <span class="notification-text">Changes saved successfully</span>
    </div>

    <script>
        const assessmentId = document.querySelector('input[name="id"]').value;
        const orgServiceId = document.querySelector('input[name="orgServiceId"]').value;
        const assessmentDate = document.querySelector('input[name="assessmentDate"]').value;

        // Get CSRF token from meta tag or hidden input
        let csrfToken = '';
        let csrfHeader = '';
        const csrfMeta = document.querySelector('meta[name="_csrf"]');
        const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
        if (csrfMeta) {
            csrfToken = csrfMeta.getAttribute('content');
            csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : 'X-CSRF-TOKEN';
        }

        const filterTextInput = document.getElementById('filterText');
        const filterRatedCheckbox = document.getElementById('filterRated');
        const hideRatedByAnotherCheckbox = document.getElementById('hideRatedByAnother');
        const filterCatalogSelect = document.getElementById('filterCatalog');
        const maturityModelSelect = document.getElementById('maturityModelSelect');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const tableBody = document.getElementById('controlsTableBody');
        const noResults = document.getElementById('noResults');
        const visibleCountSpan = document.getElementById('visibleCount');
        const totalCount = document.querySelectorAll('.control-row').length;
        const saveNotification = document.getElementById('saveNotification');

        // Store current maturity model data
        let currentMaturityModel = null;
        let maturityModels = [];

        // Load maturity models on page load
        function loadMaturityModels() {
            fetch('/maturitymodel/api/all')
                .then(response => response.json())
                .then(data => {
                    maturityModels = data;
                    // Populate the dropdown
                    maturityModels.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = model.name;
                        maturityModelSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error loading maturity models:', error));
        }

        // Handle maturity model selection
        maturityModelSelect.addEventListener('change', function () {
            const modelId = this.value;

            if (modelId === '') {
                // Reset to normal input mode
                currentMaturityModel = null;
                switchToInputMode();
            } else {
                // Load the selected model and switch to dropdown mode
                const model = maturityModels.find(m => m.id == modelId);
                currentMaturityModel = model;
                switchToAnswerMode(model);
            }
        });

        function switchToInputMode() {
            // Show all percent inputs and hide all answer selects
            document.querySelectorAll('.control-row').forEach(row => {
                const percentInput = row.querySelector('.control-percent');
                const answerSelect = row.querySelector('.control-answer');
                percentInput.style.display = 'block';
                answerSelect.style.display = 'none';
                answerSelect.value = '';
                answerSelect.removeEventListener('change', handleAnswerChange);
            });
        }

        function switchToAnswerMode(model) {
            // Show all answer selects and hide all percent inputs
            document.querySelectorAll('.control-row').forEach(row => {
                const percentInput = row.querySelector('.control-percent');
                const answerSelect = row.querySelector('.control-answer');

                // Clear previous options
                answerSelect.innerHTML = '';

                // Add "-- Select an answer --" option
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = '-- Select an answer --';
                answerSelect.appendChild(defaultOption);

                // Add maturity answers as options
                if (model.maturityAnswers && Array.isArray(model.maturityAnswers)) {
                    model.maturityAnswers.forEach(answer => {
                        const option = document.createElement('option');
                        option.value = answer.rating;
                        option.textContent = answer.answer;
                        answerSelect.appendChild(option);
                    });
                }

                // Set current percent value to the select if a matching answer exists
                const currentPercent = percentInput.value;
                if (currentPercent && currentPercent !== '0') {
                    answerSelect.value = currentPercent;
                }

                percentInput.style.display = 'none';
                answerSelect.style.display = 'block';
                answerSelect.addEventListener('change', handleAnswerChange);
            });
        }

        function handleAnswerChange(event) {
            const row = event.target.closest('.control-row');
            const controlId = row.getAttribute('data-control-id');
            const answerSelect = event.target;
            const percentValue = answerSelect.value;
            const applicable = row.querySelector('.control-applicable').checked;

            // Update the hidden percent value for backend submission
            const percentInput = row.querySelector('.control-percent');
            percentInput.value = percentValue;

            // Save the change
            saveControlChange(controlId, applicable, percentValue);
        }

        // Load security catalogs into dropdown
        function loadSecurityCatalogs() {
            fetch('/security-catalog/api')
                .then(response => response.json())
                .then(catalogs => {
                    catalogs.forEach(catalog => {
                        const option = document.createElement('option');
                        option.value = catalog.id;
                        option.textContent = catalog.name;
                        filterCatalogSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error loading catalogs:', error));
        }

        function applyFilters() {
            const selectedCatalog = filterCatalogSelect.value;
            const searchText = filterTextInput.value.toLowerCase();
            const showOnlyRated = filterRatedCheckbox.checked;
            const hideRatedByAnother = hideRatedByAnotherCheckbox.checked;
            let visibleCount = 0;

            document.querySelectorAll('.control-row').forEach(row => {
                const controlName = row.querySelector('.control-name').textContent.toLowerCase();
                const controlDetail = row.querySelector('.control-detail').textContent.toLowerCase();
                const isApplicable = row.querySelector('.control-applicable').checked;
                const isDisabled = row.querySelector('.control-applicable').disabled;

                const matchesSearch = searchText === '' ||
                    controlName.includes(searchText) ||
                    controlDetail.includes(searchText);

                const matchesRatedFilter = !showOnlyRated || isApplicable;

                const catalogMatch = selectedCatalog === '' || (row.getAttribute('data-catalog-id') === selectedCatalog);

                const matchesRatedByAnotherFilter = !hideRatedByAnother || !isDisabled;

                if (matchesSearch && matchesRatedFilter && matchesRatedByAnotherFilter && catalogMatch) {
                    row.classList.remove('hidden');
                    visibleCount++;
                } else {
                    row.classList.add('hidden');
                }
            });

            visibleCountSpan.textContent = visibleCount;
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function clearFilters() {
            filterTextInput.value = '';
            filterRatedCheckbox.checked = false;
            hideRatedByAnotherCheckbox.checked = false;
            maturityModelSelect.value = '';
            currentMaturityModel = null;
            switchToInputMode();
            applyFilters();
        }

        function showSaveNotification(isSuccess = true) {
            saveNotification.classList.remove('hide', 'error');
            const notificationText = saveNotification.querySelector('.notification-text');

            if (!isSuccess) {
                saveNotification.classList.add('error');
                notificationText.textContent = 'Failed to save changes';
            } else {
                notificationText.textContent = 'Changes saved successfully';
            }

            saveNotification.classList.add('show');

            setTimeout(() => {
                saveNotification.classList.add('hide');
                setTimeout(() => {
                    saveNotification.classList.remove('show', 'hide');
                }, 300);
            }, 2500);
        }

        function saveControlChange(controlId, applicable, percent) {
            const formData = new FormData();
            formData.append('id', assessmentId);
            formData.append('orgServiceId', orgServiceId);
            formData.append('assessmentDate', assessmentDate);
            formData.append('controlId', controlId);
            formData.append('applicable', applicable);
            formData.append('percent', percent);

            const headers = {};
            if (csrfToken) {
                headers[csrfHeader] = csrfToken;
            }

            fetch('/orgservice-assessment/save-control', {
                method: 'POST',
                body: formData,
                headers: headers
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        showSaveNotification(true);
                    } else {
                        showSaveNotification(false);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showSaveNotification(false);
                });
        }

        function saveControlComment(controlId, comment) {
            const headers = {
                'Content-Type': 'application/json'
            };
            if (csrfToken) {
                headers[csrfHeader] = csrfToken;
            }

            fetch('/orgservice-assessment/save-control-comment', {
                method: 'PUT',
                body: JSON.stringify({ id: assessmentId, controlId: controlId, comment: comment }),
                headers: headers
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        showSaveNotification(true);
                    } else {
                        showSaveNotification(false);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showSaveNotification(false);
                });
        }

        function updatePercentFieldState(row) {
            const checkbox = row.querySelector('.control-applicable');
            const percentInput = row.querySelector('.control-percent');
            const answerSelect = row.querySelector('.control-answer');
            const isApplicable = checkbox.checked;
            const isLocked = checkbox.disabled;

            // Enable percent input/select only if applicable is checked or locked
            // Disable if not applicable and not locked
            if (!isApplicable && !isLocked) {
                percentInput.disabled = true;
                answerSelect.disabled = true;
                percentInput.value = '0';
                answerSelect.value = '';
            } else {
                percentInput.disabled = isLocked;
                answerSelect.disabled = isLocked;
            }
        }

        // Event listeners for applicable checkboxes
        document.querySelectorAll('.control-applicable').forEach(checkbox => {
            checkbox.addEventListener('change', function () {
                const row = this.closest('.control-row');
                const controlId = row.getAttribute('data-control-id');

                let percent;
                if (currentMaturityModel) {
                    // In model mode, get from the select
                    const answerSelect = row.querySelector('.control-answer');
                    percent = answerSelect.value || '0';
                } else {
                    // In input mode, get from the input
                    percent = row.querySelector('.control-percent').value;
                }

                const applicable = this.checked;

                // Update the field state
                updatePercentFieldState(row);

                saveControlChange(controlId, applicable, percent);
                applyFilters();
            });
        });

        // Event listeners for percent inputs
        document.querySelectorAll('.control-percent').forEach(input => {
            let timeout;
            input.addEventListener('change', function () {
                clearTimeout(timeout);
                const row = this.closest('.control-row');
                const controlId = row.getAttribute('data-control-id');
                const applicable = row.querySelector('.control-applicable').checked;
                const percent = this.value;

                timeout = setTimeout(() => {
                    saveControlChange(controlId, applicable, percent);
                }, 500);
            });
        });

        // Event listeners for comment textareas
        var debounceTimers = {};
        document.querySelectorAll('.control-comment').forEach(textarea => {
            textarea.addEventListener('input', function () {
                const controlId = this.getAttribute('data-control-id');
                const comment = this.value;


                if (debounceTimers[controlId]) {
                    clearTimeout(debounceTimers[controlId]);
                }

                debounceTimers[controlId] = setTimeout(() => {
                    textarea.style.background = '';


                    if (comment.trim() !== '' || comment.length > 0) {
                        textarea.style.background = '#fffbe8';
                        saveControlComment(controlId, comment);
                    }
                }, 650);
            });
        });

        // Initialize percent field states on page load
        document.querySelectorAll('.control-row').forEach(row => {
            updatePercentFieldState(row);
        });

        // Load maturity models on page load
        loadMaturityModels();

        filterTextInput.addEventListener('input', applyFilters);
        filterRatedCheckbox.addEventListener('change', applyFilters);
        hideRatedByAnotherCheckbox.addEventListener('change', applyFilters);
        clearFiltersBtn.addEventListener('click', clearFilters);
        filterCatalogSelect.addEventListener('change', applyFilters);
        loadSecurityCatalogs();
    </script>
</body>

</html>
