<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <title>Org Service Assessment</title>
    <link rel="stylesheet" href="/general.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        .assessment-header {
            margin-bottom: 2em;
        }
        
        .filter-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5em;
            margin-bottom: 2em;
            border: 1px solid #e9ecef;
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em;
            align-items: center;
        }
        
        .filter-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
        
        .filter-group label {
            font-weight: 600;
            font-size: 0.95em;
            color: #495057;
        }
        
        .filter-group input[type="text"],
        .filter-group input[type="search"] {
            padding: 0.75em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
        }
        
        .filter-group input[type="text"]:focus,
        .filter-group input[type="search"]:focus {
            outline: none;
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        
        .filter-checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75em;
        }
        
        .filter-checkbox-group input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .filter-checkbox-group label {
            cursor: pointer;
            margin: 0;
            font-weight: 500;
        }
        
        .filter-stats {
            padding-top: 1.5em;
            border-top: 1px solid #e9ecef;
            margin-top: 1.5em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .filter-stat-item {
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        
        .stat-number {
            font-weight: 700;
            font-size: 1.2em;
            color: #007bff;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 1em;
            border-radius: 4px;
            margin-bottom: 1.5em;
        }
        
        .info-message {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            padding: 1em;
            border-radius: 4px;
            margin-bottom: 1.5em;
        }
        
        .controls-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        .controls-table thead {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        
        .controls-table th {
            padding: 1em;
            text-align: left;
            font-weight: 600;
            color: #495057;
            font-size: 0.95em;
        }
        
        .controls-table tbody tr {
            border-bottom: 1px solid #dee2e6;
            transition: background-color 0.2s;
        }
        
        .controls-table tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        .controls-table tbody tr.hidden {
            display: none;
        }
        
        .controls-table td {
            padding: 1em;
            vertical-align: middle;
        }
        
        .control-name {
            font-weight: 500;
            color: #212529;
            margin-bottom: 0.3em;
        }
        
        .control-detail {
            font-size: 0.9em;
            color: #6c757d;
            line-height: 1.4;
        }
        
        .control-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .control-checkbox:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .control-input {
            width: 100px;
            padding: 0.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
        }
        
        .control-input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        
        .linked-service-info {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 0.5em;
        }
        
        .linked-service-info b {
            color: #007bff;
        }
        
        .button-group {
            display: flex;
            gap: 1em;
            margin-top: 2em;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75em 1.5em;
            font-size: 1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .no-results {
            text-align: center;
            padding: 2em;
            color: #6c757d;
            font-size: 1.1em;
        }
        
        .form-table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <div class="assessment-header">
            <h1>Org Service Assessment</h1>
            <h2 th:text="${assessment.orgService.name}"></h2>
            <div class="info-message">
                <strong>Number of applicable maturity answers:</strong> <span class="stat-number" th:text="${applicableCount}"></span>
            </div>
        </div>

        <!-- Show error message if present -->
        <div th:if="${errorMsg}" class="error-message">
            <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/orgservice-assessment/save}" method="post">
            <input type="hidden" name="id" th:value="${assessment.id}" />
            <input type="hidden" name="orgService.id" th:value="${assessment.orgService.id}" />
            <input type="hidden" name="assessmentDate" th:value="${assessment.assessmentDate}" />

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="filterText">Search by Title or Description</label>
                        <input type="search" id="filterText" placeholder="Type to filter controls..." />
                    </div>
                    
                    <div class="filter-group">
                        <div class="filter-checkbox-group">
                            <input type="checkbox" id="filterRated" />
                            <label for="filterRated">Show only rated items</label>
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <div class="filter-checkbox-group">
                            <input type="checkbox" id="hideRatedByAnother" />
                            <label for="hideRatedByAnother">Hide rated by another</label>
                        </div>
                    </div>
                </div>
                
                <div class="filter-stats">
                    <div class="filter-stat-item">
                        <span>Showing:</span>
                        <span class="stat-number"><span id="visibleCount" th:text="${controls.size()}"></span>/<span th:text="${controls.size()}"></span></span>
                    </div>
                    <button type="button" id="clearFiltersBtn" class="btn btn-secondary">Clear Filters</button>
                </div>
            </div>

            <!-- Controls Table -->
            <div class="form-table-wrapper">
                <table class="controls-table">
                    <thead>
                        <tr>
                            <th>Security Control</th>
                            <th style="width: 150px;">Applicable</th>
                            <th style="width: 120px;">Percent</th>
                        </tr>
                    </thead>
                    <tbody id="controlsTableBody">
                        <tr th:each="control,stat : ${controls}" th:attr="data-control-index=${stat.index}" class="control-row">
                            <td>
                                <div class="control-name" th:text="${control.securityControl.name}"></div>
                                <div class="control-detail" th:text="${control.securityControl.detail}"></div>
                            </td>
                            <td>
                                <input type="checkbox" class="control-checkbox control-applicable"
                                       th:name="'controls[' + ${stat.index} + '].applicable'"
                                       th:checked="${control.applicable}"
                                       th:disabled="${control.answeredByAnotherAssessment}" />
                                <input type="hidden" th:name="'controls[' + ${stat.index} + '].securityControl.id'"
                                    th:value="${control.securityControl.id}" />
                                <input type="hidden" th:name="'controls[' + ${stat.index} + '].id'"
                                    th:value="${control.id}" />
                                <div class="linked-service-info" th:if="${control.answeredByAnotherAssessment}">
                                    Already linked to: <b th:text="${control.answeredByOrgServiceName}"></b>
                                </div>
                            </td>
                            <td>
                                <input type="number" min="0" max="100" class="control-input control-percent"
                                    th:name="'controls[' + ${stat.index} + '].percent'"
                                    th:value="${control.percent}" required
                                    th:disabled="${control.answeredByAnotherAssessment}" />
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="noResults" class="no-results" style="display: none;">
                    No security controls match your filters.
                </div>
            </div>

            <!-- Button Group -->
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Save Assessment</button>
                <a th:href="@{|/orgservices/edit/${assessment.orgService.id}|}" class="btn btn-secondary">Back to Org Service</a>
            </div>
        </form>
    </div>

    <script>
        const filterTextInput = document.getElementById('filterText');
        const filterRatedCheckbox = document.getElementById('filterRated');
        const hideRatedByAnotherCheckbox = document.getElementById('hideRatedByAnother');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const tableBody = document.getElementById('controlsTableBody');
        const noResults = document.getElementById('noResults');
        const visibleCountSpan = document.getElementById('visibleCount');
        const totalCount = document.querySelectorAll('.control-row').length;

        function applyFilters() {
            const searchText = filterTextInput.value.toLowerCase();
            const showOnlyRated = filterRatedCheckbox.checked;
            const hideRatedByAnother = hideRatedByAnotherCheckbox.checked;
            let visibleCount = 0;

            document.querySelectorAll('.control-row').forEach(row => {
                const controlName = row.querySelector('.control-name').textContent.toLowerCase();
                const controlDetail = row.querySelector('.control-detail').textContent.toLowerCase();
                const isApplicable = row.querySelector('.control-applicable').checked;
                const isDisabled = row.querySelector('.control-applicable').disabled;

                const matchesSearch = searchText === '' || 
                                    controlName.includes(searchText) || 
                                    controlDetail.includes(searchText);
                
                const matchesRatedFilter = !showOnlyRated || isApplicable;
                
                const matchesRatedByAnotherFilter = !hideRatedByAnother || !isDisabled;

                if (matchesSearch && matchesRatedFilter && matchesRatedByAnotherFilter) {
                    row.classList.remove('hidden');
                    visibleCount++;
                } else {
                    row.classList.add('hidden');
                }
            });

            visibleCountSpan.textContent = visibleCount;
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function clearFilters() {
            filterTextInput.value = '';
            filterRatedCheckbox.checked = false;
            hideRatedByAnotherCheckbox.checked = false;
            applyFilters();
        }

        filterTextInput.addEventListener('input', applyFilters);
        filterRatedCheckbox.addEventListener('change', applyFilters);
        hideRatedByAnotherCheckbox.addEventListener('change', applyFilters);
        clearFiltersBtn.addEventListener('click', clearFilters);

        // Also update visibility when applicable checkbox changes
        document.querySelectorAll('.control-applicable').forEach(checkbox => {
            checkbox.addEventListener('change', applyFilters);
        });
    </script>
</body>

</html>
