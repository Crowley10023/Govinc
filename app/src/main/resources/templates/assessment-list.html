<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Assessment List</title>
    <link rel="stylesheet" href="/general.css">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
         <section>
            <div class="filters" style="margin-bottom: 1em; display: flex; align-items: center; gap: 1em; flex-wrap: wrap;">
                <button id="orgUnitFilterBtn" class="btn btn-secondary" type="button" style="display: none;">Org Unit</button>
                <span id="activeOrgUnitFilter" style="display:none; align-items: center;" class="badge">
                    <span id="orgUnitFilterName"></span>
                    <svg id="clearOrgUnitFilter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16"
                        height="16" style="margin-left:0.5em;cursor:pointer;">
                        <circle cx="8" cy="8" r="8" fill="#ccc" />
                        <path d="M5 5l6 6M11 5l-6 6" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </span>
                <div style="display: flex; align-items: center; gap: 0.5em;">
                    <label for="sortSelect" style="font-weight: 500;">Sort by:</label>
                    <select id="sortSelect" class="form-control" style="min-width: 150px;">
                        <option value="date-desc">Date (Newest First)</option>
                        <option value="date-asc">Date (Oldest First)</option>
                        <option value="catalog">Security Catalog</option>
                        <option value="orgunit">Org Unit</option>
                        <option value="status">Assessment Status</option>
                    </select>
                </div>
            </div>
            <table class="table card">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Catalog</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assessmentTbody">
                    <tr th:each="assessment : ${assessments}"
                        th:data-orgunitid="${assessment.orgUnit != null ? assessment.orgUnit.id : 0}"
                        th:data-assessment-id="${assessment.id}"
                        style="cursor: pointer;"
                        class="assessment-row">
                        <td th:text="${assessment.name}"></td>
                        <td th:text="${assessment.date}"></td>
                        <td th:text="${assessment.status}"></td>
                        <td th:text="${assessment.securityCatalog.name}"></td>
                        <td>
                            <button class="btn btn-danger btn-sm delete-btn" type="button">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- Delete Confirmation Modal -->
            <div id="deleteConfirmModal"
                style="display:none; position: fixed; z-index: 1002; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.25);">
                <div
                    style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; width: 90vw; max-width: 400px; padding: 2em; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" style="margin: 0 auto 1em; color: #dc3545; fill: currentColor;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <h3 style="margin: 0 0 0.5em 0; color: #333;">Delete Assessment?</h3>
                    <p style="margin: 0 0 1.5em 0; color: #666; font-size: 0.95em;">This action cannot be undone. Are you sure you want to delete this assessment?</p>
                    <div style="display: flex; gap: 1em; justify-content: center;">
                        <button id="deleteConfirmBtn" class="btn btn-danger" type="button">Delete</button>
                        <button id="deleteCancelBtn" class="btn btn-secondary" type="button">Cancel</button>
                    </div>
                </div>
            </div>
            <!-- Org Unit Selection Modal -->
            <div id="orgUnitModal"
                style="display:none; position: fixed; z-index: 1001; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.25);">
                <div
                    style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; width: 70vw; max-width: 600px; height: 70vh; overflow: auto; padding: 1.5em; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.2);">
                    <h2>Select Org Unit</h2>
                    <div id="orgUnitList" style="margin-bottom: 2em;"></div>
                    <button id="orgUnitConfirmBtn" class="btn btn-primary" type="button">Confirm</button>
                    <button id="orgUnitCancelBtn" class="btn btn-secondary" type="button"
                        style="margin-left:1em;">Cancel</button>
                </div>
            </div>
            <script>
                let orgUnitsCache = null;
                let selectedOrgUnit = null;
                let currentSortOption = 'date-desc';
                let pendingDeleteId = null;

                // Check for orgUnit parameter on page load and initialize filter button visibility
                document.addEventListener('DOMContentLoaded', function () {
                    const urlParams = new URLSearchParams(window.location.search);
                    const orgUnitParam = urlParams.get('orgUnit');

                    // Check if user can filter by org units (fetch available org units)
                    fetch('/assessmentdetails/orgunits')
                        .then(res => res.json())
                        .then(orgUnits => {
                            orgUnitsCache = orgUnits;
                            // Show filter button only if user has accessible org units
                            if (orgUnits && orgUnits.length > 0) {
                                document.getElementById('orgUnitFilterBtn').style.display = 'inline-block';
                            }

                            if (orgUnitParam) {
                                const matchedOrgUnit = orgUnits.find(u => u.id == orgUnitParam);
                                if (matchedOrgUnit) {
                                    selectedOrgUnit = matchedOrgUnit;
                                    applyOrgUnitFilter();
                                }
                            }
                        });

                    // Setup row click handlers
                    setupAssessmentRowHandlers();

                    // Setup sort dropdown
                    setupSortDropdown();
                });

                function setupSortDropdown() {
                    const sortSelect = document.getElementById('sortSelect');
                    sortSelect.addEventListener('change', function() {
                        currentSortOption = this.value;
                        applySorting();
                    });
                }

                function applySorting() {
                    const tbody = document.getElementById('assessmentTbody');
                    const rows = Array.from(tbody.querySelectorAll('tr'));

                    rows.sort((a, b) => {
                        switch(currentSortOption) {
                            case 'date-desc':
                                return new Date(b.children[1].textContent) - new Date(a.children[1].textContent);
                            case 'date-asc':
                                return new Date(a.children[1].textContent) - new Date(b.children[1].textContent);
                            case 'catalog':
                                return a.children[3].textContent.localeCompare(b.children[3].textContent);
                            case 'orgunit':
                                const ouA = a.getAttribute('data-orgunitid');
                                const ouB = b.getAttribute('data-orgunitid');
                                return parseInt(ouA) - parseInt(ouB);
                            case 'status':
                                return a.children[2].textContent.localeCompare(b.children[2].textContent);
                            default:
                                return 0;
                        }
                    });

                    // Re-append sorted rows
                    rows.forEach(row => tbody.appendChild(row));
                }

                function setupAssessmentRowHandlers() {
                    const assessmentRows = document.querySelectorAll('.assessment-row');
                    assessmentRows.forEach(row => {
                        row.addEventListener('click', function (e) {
                            // Don't navigate if delete button was clicked
                            if (e.target.closest('.delete-btn')) {
                                e.stopPropagation();
                                return;
                            }
                            const assessmentId = this.getAttribute('data-assessment-id');
                            window.location.href = '/assessment/' + assessmentId;
                        });
                    });

                    // Delete button click handler
                    const deleteButtons = document.querySelectorAll('.delete-btn');
                    deleteButtons.forEach(btn => {
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            const row = this.closest('.assessment-row');
                            const assessmentId = row.getAttribute('data-assessment-id');
                            showDeleteConfirmation(assessmentId);
                        });
                    });
                }

                function showDeleteConfirmation(assessmentId) {
                    pendingDeleteId = assessmentId;
                    document.getElementById('deleteConfirmModal').style.display = 'block';
                }

                document.getElementById('deleteConfirmBtn').addEventListener('click', function () {
                    if (pendingDeleteId) {
                        // Use form submission to POST to delete endpoint
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/assessment/' + pendingDeleteId + '/delete';
                        
                        // Add CSRF token
                        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                        if (csrfToken) {
                            const csrfInput = document.createElement('input');
                            csrfInput.type = 'hidden';
                            csrfInput.name = '_csrf';
                            csrfInput.value = csrfToken;
                            form.appendChild(csrfInput);
                        }
                        
                        document.body.appendChild(form);
                        form.submit();
                    }
                });

                document.getElementById('deleteCancelBtn').addEventListener('click', function () {
                    document.getElementById('deleteConfirmModal').style.display = 'none';
                    pendingDeleteId = null;
                });

                // Modal close on click outside
                document.getElementById('deleteConfirmModal').addEventListener('click', function (e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                        pendingDeleteId = null;
                    }
                });

                document.getElementById('orgUnitFilterBtn').addEventListener('click', function () {
                    document.getElementById('orgUnitModal').style.display = 'block';
                    if (!orgUnitsCache) {
                        fetch('/assessmentdetails/orgunits')
                            .then(res => res.json())
                            .then(orgUnits => {
                                orgUnitsCache = orgUnits;
                                populateOrgUnitList(orgUnits);
                            });
                    } else {
                        populateOrgUnitList(orgUnitsCache);
                    }
                });
                document.getElementById('orgUnitCancelBtn').onclick = function () {
                    document.getElementById('orgUnitModal').style.display = 'none';
                };
                function populateOrgUnitList(units) {
                    let listDiv = document.getElementById('orgUnitList');
                    listDiv.innerHTML = '';
                    if (!units || units.length === 0) {
                        listDiv.innerHTML = '<div>No org units available.</div>';
                        return;
                    }
                    let selectedId = selectedOrgUnit ? selectedOrgUnit.id : null;
                    units.forEach(ou => {
                        let label = document.createElement('label');
                        label.style.display = 'block';
                        label.style.marginBottom = '0.5em';
                        let radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = 'orgUnitChoice';
                        radio.value = ou.id;
                        radio.style.marginRight = '0.5em';
                        if (selectedId && ou.id === selectedId) radio.checked = true;
                        label.appendChild(radio);
                        label.appendChild(document.createTextNode(ou.name));
                        listDiv.appendChild(label);
                        radio.addEventListener('change', () => {
                            selectedOrgUnit = ou;
                        });
                    });
                }
                document.getElementById('orgUnitConfirmBtn').onclick = function () {
                    // Always get the checked radio on confirm
                    const checkedRadio = document.querySelector('#orgUnitList input[type=radio]:checked');
                    if (checkedRadio) {
                        selectedOrgUnit = orgUnitsCache.find(u => u.id == checkedRadio.value);
                    } else {
                        selectedOrgUnit = null;
                    }
                    document.getElementById('orgUnitModal').style.display = 'none';
                    applyOrgUnitFilter();
                };

                document.getElementById('clearOrgUnitFilter').onclick = function () {
                    selectedOrgUnit = null;
                    applyOrgUnitFilter();
                };
                function applyOrgUnitFilter() {
                    // Wait for DOM to be ready if called early
                    const tbody = document.getElementById('assessmentTbody');
                    if (!tbody) {
                        setTimeout(applyOrgUnitFilter, 100);
                        return;
                    }
                    
                    let rows = tbody.querySelectorAll('tr');
                    let filterActive = !!selectedOrgUnit;
                    rows.forEach(row => {
                        if (filterActive) {
                            let ouid = row.getAttribute('data-orgunitid');
                            if (parseInt(ouid, 10) === selectedOrgUnit.id) {
                                row.style.display = '';
                            } else {
                                row.style.display = 'none';
                            }
                        } else {
                            row.style.display = '';
                        }
                    });

                    // Show/hide filter badge
                    let badge = document.getElementById('activeOrgUnitFilter');
                    let nameSpan = document.getElementById('orgUnitFilterName');
                    if (filterActive) {
                        badge.style.display = 'inline-flex';
                        nameSpan.textContent = selectedOrgUnit.name;
                    } else {
                        badge.style.display = 'none';
                        nameSpan.textContent = '';
                    }
                }
                // Modal close on click outside
                document.getElementById('orgUnitModal').addEventListener('click', function (e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
                // Modal close on ESC
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        document.getElementById('orgUnitModal').style.display = 'none';
                        document.getElementById('deleteConfirmModal').style.display = 'none';
                    }
                });
            </script>
        </section>
    </div>

</body>

</html>
