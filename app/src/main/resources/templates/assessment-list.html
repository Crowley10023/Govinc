<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Assessment List</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block></head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <h1 class="page-title">Assessments</h1>
         <section>
            <!-- Filter Bar -->
            <div class="filter-card">
                <div class="filter-inputs">
                    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:0.4em;">
                        <button id="orgUnitFilterBtn" class="btn-secondary btn-sm d-none" type="button">Choose Org Unit&hellip;</button>
                        <span id="activeOrgUnitFilter" class="active-filter-tag" style="display:none">
                            <span class="active-filter-tag-label">Org Unit:</span>
                            <span id="orgUnitFilterName" class="active-filter-tag-value"></span>
                            <button type="button" id="clearOrgUnitFilter" class="active-filter-tag-remove" title="Remove filter">&#10005;</button>
                        </span>
                    </div>
                    <div>
                        <label for="filterAssName">Name:</label>
                        <input type="text" id="filterAssName" class="col-filter" data-col="0" placeholder="Filter name…">
                    </div>
                    <div>
                        <label for="filterAssDate">Date:</label>
                        <input type="text" id="filterAssDate" class="col-filter" data-col="1" placeholder="Filter date…">
                    </div>
                    <div>
                        <label for="filterAssCreator">Creator:</label>
                        <select id="filterAssCreator" class="col-filter" data-col="2">
                            <option value="">All creators</option>
                        </select>
                    </div>
                    <div>
                        <label for="filterAssStatus">Status:</label>
                        <select id="filterAssStatus" class="col-filter" data-col="3">
                            <option value="">All statuses</option>
                        </select>
                    </div>
                    <div>
                        <label for="filterAssCatalog">Catalog:</label>
                        <select id="filterAssCatalog" class="col-filter" data-col="4">
                            <option value="">All catalogs</option>
                        </select>
                    </div>
                </div>
            </div>
            <table class="table card" id="assessmentTable">
                <thead>
                    <tr>
                        <th class="sortable-th" data-col="0">Name<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="1">Created Date<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="2">Created By<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="3">Status<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="4">Catalog<span class="sort-arrow"></span></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assessmentTbody">
                    <tr th:each="assessment : ${assessments}"
                        th:data-orgunitid="${assessment.orgUnit != null ? assessment.orgUnit.id : 0}"
                        th:data-assessment-id="${assessment.id}"
                        class="assessment-row">
                        <td th:text="${assessment.name}"></td>
                        <td th:text="${assessment.creationDate != null ? #temporals.format(assessment.creationDate, 'dd MMM yyyy') : 'N/A'}" th:attr="data-iso-date=${assessment.creationDate != null ? #temporals.format(assessment.creationDate, 'yyyy-MM-dd') : ''}"></td>
                        <td th:text="${assessment.createdBy != null ? assessment.createdBy.name : 'N/A'}"></td>
                        <td th:text="${assessment.status}"></td>
                        <td th:text="${assessment.securityCatalog != null ? assessment.securityCatalog.name : 'N/A'}"></td>
                        <td>
                            <button th:if="${isAdminOrISM}" class="btn-danger btn-sm delete-btn" type="button">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- Delete Confirmation Modal -->
            <div id="deleteConfirmModal" class="modal-bg" style="display:none">
                <div class="modal-popup-confirmation">
                    <h3>Delete Assessment?</h3>
                    <p>This action cannot be undone. Are you sure you want to delete this assessment?</p>
                    <div class="modal-btn-row">
                        <button id="deleteCancelBtn" class="btn-cancel" type="button">Cancel</button>
                        <button id="deleteConfirmBtn" class="btn-danger" type="button">Delete</button>
                    </div>
                </div>
            </div>
            <!-- Org Unit Selection Wizard Modal -->
            <div id="orgUnitModal" class="modal-bg" style="display:none">
                <div class="modal-popup ou-wizard-modal-inner">
                    <h2 class="ou-wizard-title">Select Org Unit</h2>
                    <div id="orgUnitWizardViewport" class="ou-wizard-viewport"></div>
                    <div class="modal-btn-row ou-wizard-footer">
                        <button id="orgUnitCancelBtn" class="btn-cancel" type="button">Cancel</button>
                    </div>
                </div>
            </div>
            <script>
                let orgUnitsCache = null;
                let selectedOrgUnit = null;
                let pendingDeleteId = null;

                // Check for orgUnit parameter on page load and initialize filter button visibility
                document.addEventListener('DOMContentLoaded', function () {
                    const urlParams = new URLSearchParams(window.location.search);
                    const orgUnitParam = urlParams.get('orgUnit');

                    // Check if user can filter by org units (fetch available org units)
                    fetch('/assessmentdetails/orgunits')
                        .then(res => res.json())
                        .then(orgUnits => {
                            orgUnitsCache = orgUnits;
                            // Show filter button only if user has accessible org units
                            if (orgUnits && orgUnits.length > 0) {
                                document.getElementById('orgUnitFilterBtn').classList.remove('d-none');
                            }

                            if (orgUnitParam) {
                                const matchedOrgUnit = orgUnits.find(u => u.id == orgUnitParam);
                                if (matchedOrgUnit) {
                                    selectedOrgUnit = matchedOrgUnit;
                                    applyOrgUnitFilter();
                                }
                            }
                        });

                    // Setup row click handlers
                    setupAssessmentRowHandlers();
                    populateFilterSelects();
                });

                function setupAssessmentRowHandlers() {
                    const assessmentRows = document.querySelectorAll('.assessment-row');
                    assessmentRows.forEach(row => {
                        row.addEventListener('click', function (e) {
                            // Don't navigate if delete button was clicked
                            if (e.target.closest('.delete-btn')) {
                                e.stopPropagation();
                                return;
                            }
                            const assessmentId = this.getAttribute('data-assessment-id');
                            window.location.href = '/assessment/' + assessmentId;
                        });
                    });

                    // Delete button click handler
                    const deleteButtons = document.querySelectorAll('.delete-btn');
                    deleteButtons.forEach(btn => {
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            const row = this.closest('.assessment-row');
                            const assessmentId = row.getAttribute('data-assessment-id');
                            showDeleteConfirmation(assessmentId);
                        });
                    });
                }

                function showDeleteConfirmation(assessmentId) {
                    pendingDeleteId = assessmentId;
                    document.getElementById('deleteConfirmModal').style.display = 'flex';
                }

                document.getElementById('deleteConfirmBtn').addEventListener('click', function () {
                    if (pendingDeleteId) {
                        // Use form submission to POST to delete endpoint
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/assessment/' + pendingDeleteId + '/delete';
                        
                        // Add CSRF token
                        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                        if (csrfToken) {
                            const csrfInput = document.createElement('input');
                            csrfInput.type = 'hidden';
                            csrfInput.name = '_csrf';
                            csrfInput.value = csrfToken;
                            form.appendChild(csrfInput);
                        }
                        
                        document.body.appendChild(form);
                        form.submit();
                    }
                });

                document.getElementById('deleteCancelBtn').addEventListener('click', function () {
                    document.getElementById('deleteConfirmModal').style.display = 'none';
                    pendingDeleteId = null;
                });

                // Modal close on click outside
                document.getElementById('deleteConfirmModal').addEventListener('click', function (e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                        pendingDeleteId = null;
                    }
                });

                // ── Org Unit Wizard ──────────────────────────────────────
                let orgUnitMap = {};
                let wizardStack = [];

                function buildOrgUnitTree(units) {
                    orgUnitMap = {};
                    units.forEach(u => { orgUnitMap[u.id] = u; });
                    const childIds = new Set();
                    units.forEach(u => {
                        if (u.children) {
                            u.children.forEach(c => { if (orgUnitMap[c.id]) childIds.add(c.id); });
                        }
                    });
                    return units.filter(u => !childIds.has(u.id))
                                .sort((a, b) => a.name.localeCompare(b.name));
                }

                function getWizardChildren(unit) {
                    if (!unit.children || unit.children.length === 0) return [];
                    return unit.children
                        .map(c => orgUnitMap[c.id])
                        .filter(Boolean)
                        .sort((a, b) => a.name.localeCompare(b.name));
                }

                function openOrgUnitWizard() {
                    const topLevel = buildOrgUnitTree(orgUnitsCache);
                    wizardStack = [topLevel];
                    const vp = document.getElementById('orgUnitWizardViewport');
                    vp.innerHTML = '';
                    renderWizardPanel(topLevel, null);
                    document.getElementById('orgUnitModal').style.display = 'flex';
                }

                function renderWizardPanel(units, direction) {
                    const vp = document.getElementById('orgUnitWizardViewport');
                    const panel = document.createElement('div');
                    panel.classList.add('ou-wizard-panel');

                    const content = document.createElement('div');
                    content.classList.add('ou-wizard-content');

                    const listShell = document.createElement('div');
                    listShell.classList.add('ou-wizard-list-shell');

                    const list = document.createElement('div');
                    list.classList.add('ou-wizard-list');

                    // Back button when not at root — identical styling to drill-btn
                    if (wizardStack.length > 1) {
                        const sideNav = document.createElement('div');
                        sideNav.classList.add('ou-wizard-side-nav');
                        const backBtn = document.createElement('button');
                        backBtn.type = 'button';
                        backBtn.title = 'Go up one level';
                        backBtn.classList.add('ou-wizard-nav-btn');
                        backBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="9" height="13" viewBox="0 0 9 13"><polygon points="8,1 1,6.5 8,12" fill="currentColor"/></svg>';
                        backBtn.addEventListener('click', () => {
                            wizardStack.pop();
                            renderWizardPanel(wizardStack[wizardStack.length - 1], 'back');
                        });
                        sideNav.appendChild(backBtn);
                        content.appendChild(sideNav);
                    }

                    if (!units || units.length === 0) {
                        const empty = document.createElement('div');
                        empty.classList.add('ou-wizard-empty');
                        empty.textContent = 'No org units available.';
                        list.appendChild(empty);
                    } else {
                        units.forEach(unit => {
                            const children = getWizardChildren(unit);
                            const row = document.createElement('div');
                            row.classList.add('ou-wizard-row');

                            const selectBtn = document.createElement('button');
                            selectBtn.type = 'button';
                            selectBtn.textContent = unit.name;
                            selectBtn.classList.add('ou-wizard-select-btn');
                            if (children.length > 0) selectBtn.classList.add('has-children');
                            if (selectedOrgUnit && selectedOrgUnit.id === unit.id) selectBtn.classList.add('selected');
                            selectBtn.addEventListener('click', () => {
                                selectedOrgUnit = unit;
                                document.getElementById('orgUnitModal').style.display = 'none';
                                applyOrgUnitFilter();
                            });
                            row.appendChild(selectBtn);

                            if (children.length > 0) {
                                const drillBtn = document.createElement('button');
                                drillBtn.type = 'button';
                                drillBtn.title = 'Show sub-units';
                                drillBtn.classList.add('ou-wizard-nav-btn', 'drill-btn');
                                drillBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="9" height="13" viewBox="0 0 9 13"><polygon points="1,1 8,6.5 1,12" fill="currentColor"/></svg>';
                                drillBtn.addEventListener('click', () => {
                                    wizardStack.push(children);
                                    renderWizardPanel(children, 'forward');
                                });
                                row.appendChild(drillBtn);
                            }

                            list.appendChild(row);
                        });
                    }

                    listShell.appendChild(list);
                    content.appendChild(listShell);
                    panel.appendChild(content);

                    // Slide animation (transform/transition set in JS — required for dynamic animation)
                    const existing = vp.querySelector('.ou-wizard-panel');
                    if (!direction || !existing) {
                        vp.innerHTML = '';
                        vp.appendChild(panel);
                        return;
                    }
                    const enterFrom = direction === 'forward' ? '100%' : '-100%';
                    const exitTo   = direction === 'forward' ? '-100%' : '100%';
                    panel.style.transform = `translateX(${enterFrom})`;
                    vp.appendChild(panel);
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        panel.style.transition = 'transform 0.24s cubic-bezier(.4,0,.2,1)';
                        panel.style.transform = 'translateX(0)';
                        existing.style.transition = 'transform 0.24s cubic-bezier(.4,0,.2,1)';
                        existing.style.transform = `translateX(${exitTo})`;
                        existing.addEventListener('transitionend', () => existing.remove(), { once: true });
                    }));
                }

                document.getElementById('orgUnitFilterBtn').addEventListener('click', function () {
                    if (!orgUnitsCache) {
                        fetch('/assessmentdetails/orgunits')
                            .then(res => res.json())
                            .then(units => { orgUnitsCache = units; openOrgUnitWizard(); });
                    } else {
                        openOrgUnitWizard();
                    }
                });

                document.getElementById('orgUnitCancelBtn').addEventListener('click', function () {
                    document.getElementById('orgUnitModal').style.display = 'none';
                });

                document.getElementById('clearOrgUnitFilter').onclick = function () {
                    selectedOrgUnit = null;
                    applyOrgUnitFilter();
                };
                function applyOrgUnitFilter() {
                    applyAllFilters();
                }

                function applyAllFilters() {
                    // Wait for DOM to be ready if called early
                    const tbody = document.getElementById('assessmentTbody');
                    if (!tbody) {
                        setTimeout(applyAllFilters, 100);
                        return;
                    }

                    // Collect column filter values
                    const colFilters = Array.from(document.querySelectorAll('.col-filter'))
                        .map(inp => ({ col: parseInt(inp.getAttribute('data-col')), val: inp.value.trim().toLowerCase() }));

                    let rows = tbody.querySelectorAll('tr');
                    rows.forEach(row => {
                        // Org unit filter
                        let ouMatch = true;
                        if (selectedOrgUnit) {
                            let ouid = row.getAttribute('data-orgunitid');
                            ouMatch = parseInt(ouid, 10) === selectedOrgUnit.id;
                        }
                        // Column filters
                        let colMatch = colFilters.every(f => {
                            if (!f.val) return true;
                            let cell = row.children[f.col];
                            return cell && cell.textContent.trim().toLowerCase().includes(f.val);
                        });
                        row.style.display = (ouMatch && colMatch) ? '' : 'none';
                    });

                    // Show/hide filter badge
                    let badge = document.getElementById('activeOrgUnitFilter');
                    let nameSpan = document.getElementById('orgUnitFilterName');
                    if (selectedOrgUnit) {
                        badge.style.display = 'inline-flex';
                        nameSpan.textContent = selectedOrgUnit.name;
                    } else {
                        badge.style.display = 'none';
                        nameSpan.textContent = '';
                    }
                }
                // Modal close on click outside
                document.getElementById('orgUnitModal').addEventListener('click', function (e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
                // Modal close on ESC
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        document.getElementById('orgUnitModal').style.display = 'none';
                        document.getElementById('deleteConfirmModal').style.display = 'none';
                    }
                });

                function populateFilterSelects() {
                    const rows = document.querySelectorAll('#assessmentTbody tr');
                    const creators = new Set(), statuses = new Set(), catalogs = new Set();
                    rows.forEach(function(row) {
                        const c = row.children;
                        if (c[2]) creators.add(c[2].textContent.trim());
                        if (c[3]) statuses.add(c[3].textContent.trim());
                        if (c[4]) catalogs.add(c[4].textContent.trim());
                    });
                    function fillSelect(id, values) {
                        const sel = document.getElementById(id);
                        if (!sel) return;
                        Array.from(values).filter(v => v && v !== 'N/A').sort().forEach(function(v) {
                            const opt = document.createElement('option');
                            opt.value = v; opt.textContent = v;
                            sel.appendChild(opt);
                        });
                    }
                    fillSelect('filterAssCreator', creators);
                    fillSelect('filterAssStatus', statuses);
                    fillSelect('filterAssCatalog', catalogs);
                }

                // Column filter inputs
                document.querySelectorAll('.col-filter').forEach(inp => {
                    inp.addEventListener('input', applyAllFilters);
                    inp.addEventListener('change', applyAllFilters);
                    // Prevent row click when clicking filter inputs
                    inp.addEventListener('click', e => e.stopPropagation());
                });

                // Sortable column headers
                (function() {
                    var sortState = { col: -1, dir: 0 };
                    var ths = document.querySelectorAll('#assessmentTable thead .sortable-th');
                    ths.forEach(function(th) {
                        th.addEventListener('click', function() {
                            var col = parseInt(this.getAttribute('data-col'));
                            if (sortState.col === col) {
                                sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
                            } else {
                                sortState.col = col;
                                sortState.dir = 1;
                            }
                            ths.forEach(function(h) { h.classList.remove('sort-asc','sort-desc'); });
                            if (sortState.dir === 1) this.classList.add('sort-asc');
                            else if (sortState.dir === -1) this.classList.add('sort-desc');
                            if (sortState.dir !== 0) {
                                var tbody = document.getElementById('assessmentTbody');
                                var rows = Array.from(tbody.querySelectorAll('tr'));
                                var dir = sortState.dir;
                                rows.sort(function(a, b) {
                                    var av = a.children[col].textContent.trim().toLowerCase();
                                    var bv = b.children[col].textContent.trim().toLowerCase();
                                    if (col === 1) { // date column — sort by ISO date attribute
                                        var ad = a.children[col].getAttribute('data-iso-date') || av;
                                        var bd = b.children[col].getAttribute('data-iso-date') || bv;
                                        return ad.localeCompare(bd) * dir;
                                    }
                                    return av.localeCompare(bv) * dir;
                                });
                                rows.forEach(function(r) { tbody.appendChild(r); });
                            }
                        });
                    });
                })();
            </script>
        </section>
    </div>

</body>

</html>
