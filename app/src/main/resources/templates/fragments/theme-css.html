<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <th:block th:fragment="themeCss">
        <style type="text/css">
        :root {
            /* Use DB-configured values, fallback to defaults if null */
            --primary-blue: [[${layoutConfig.primaryColor} ?: '#2274A5']];
            --primary-blue-dark: [[${layoutConfig.primaryColorDark} ?: '#164666']];
            --accent-orange: [[${layoutConfig.accentColor} ?: '#FF9505']];
            --background-light: [[${layoutConfig.backgroundColor} ?: '#F5F9FC']];
            --border: [[${layoutConfig.borderColor} ?: '#dae1e7']];
            --nav-violet: [[${layoutConfig.navViolet} ?: '#ebe8fc']];
            --text-main: [[${layoutConfig.textMain} ?: '#222E3A']];
            --shine-glare: [[${layoutConfig.shineGlare} ?: 'rgba(255,255,255,0.60)']];
            --shine-highlight: [[${layoutConfig.shineHighlight} ?: 'rgba(255,255,255,0.33)']];
            --secondary-color: [[${layoutConfig.secondaryColor} ?: '#9596AE']];
            --nav-font-family: [[${layoutConfig.fontFamily} ?: 'Segoe UI, Arial, sans-serif']];
            --font-size-nav: [[${layoutConfig.fontSizeNav} ?: '1em']];
            --font-size-headline: [[${layoutConfig.fontSizeHeadline} ?: '1.5em']];

            /* New theme variables mapped from CSS */
            --success-green: [[${layoutConfig.successGreen} ?: '#33aa33']];
            --error-red: [[${layoutConfig.errorRed} ?: '#cc2222']];
            --modal-beige1: [[${layoutConfig.modalBeige1} ?: '#fffbe7']];
            --modal-beige2: [[${layoutConfig.modalBeige2} ?: '#ffe6d1']];
            --modal-beige3: [[${layoutConfig.modalBeige3} ?: '#ffe3ad']];
            --modal-beige4: [[${layoutConfig.modalBeige4} ?: '#ffd995']];
            --label-gold: [[${layoutConfig.labelGold} ?: '#ab6f00']];
            --gray-777: [[${layoutConfig.gray777} ?: '#777']];
            --gray-888: [[${layoutConfig.gray888} ?: '#888']];
            --table-bg1: [[${layoutConfig.tableBg1} ?: '#f8faff']];
            --table-bg2: [[${layoutConfig.tableBg2} ?: '#e9f4fc']];
            --table-bg3: [[${layoutConfig.tableBg3} ?: '#daf0ff']];
            --table-bg4: [[${layoutConfig.tableBg4} ?: '#f4fbff']];
            --table-bg5: [[${layoutConfig.tableBg5} ?: '#b8d8ec']];
            --header-grad-highlight: [[${layoutConfig.headerGradHighlight} ?: '#5adaff']];
            --yellow-highlight: [[${layoutConfig.yellowHighlight} ?: '#ffd867']];
            --table-hover1: [[${layoutConfig.tableHover1} ?: '#eaf3fa']];
            --table-hover2: [[${layoutConfig.tableHover2} ?: '#fcf6e4']];
            --alert-bg1: [[${layoutConfig.alertBg1} ?: '#fffbea']];
            --alert-bg2: [[${layoutConfig.alertBg2} ?: '#ffeedd']];
            --alert-color: [[${layoutConfig.alertColor} ?: '#945100']];
            --taken-over-bg: [[${layoutConfig.takenOverBg} ?: '#eee']];
            --dropdown-bg-hover: [[${layoutConfig.dropdownBgHover} ?: '#d1e7f8']];
            --secondary-nav-bg: [[${layoutConfig.secondaryNavBg} ?: '#f8fbfd']];
            --secondary-nav-border: [[${layoutConfig.secondaryNavBorder} ?: '#e3e9ef']];
            --logo-border: [[${layoutConfig.logoBorder} ?: '#e2f1fe']];
            --dropdown-hover-blue: [[${layoutConfig.dropdownHoverBlue} ?: '#185a89']];
            --mainnav-border: [[${layoutConfig.mainNavBorder} ?: '#d6c7f5']];
            --faint-blue1: [[${layoutConfig.faintBlue1} ?: '#f6faff']];
        }
        </style>
    </th:block>
</body>
</html>
