<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>User List</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1>User List</h1>
    <a href="/users/new" class="btn-action">Add User</a>
    
    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <p>No users found.</p>
        <a href="/users/new" class="btn-action">Create the first one</a>
    </div>
    
    <div th:if="${not #lists.isEmpty(users)}">
        <table class="table card">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>ID</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role != null ? user.role : '—'}"></td>
                    <td th:text="${user.id}"></td>
                    <td>
                        <a th:href="@{'/users/edit/' + ${user.id}}" class="btn-edit">Edit</a>
                        <a th:href="@{'/users/delete/' + ${user.id}}"
                           class="btn-danger"
                           th:attr="data-user-id=${user.id},data-user-name=${user.name}"
                           onclick="return openDeleteModal(event)">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="deleteModalBackdrop" class="modal-bg" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <div class="modal-popup">
        <h3 id="deleteModalTitle">Delete User</h3>
        <p id="deleteModalSummary"></p>

        <div class="delete-list-wrap">
            <strong>Assessments where this user is in the "user" field:</strong>
            <ul id="userAssessmentList" class="delete-list"></ul>
        </div>

        <div id="createdByBlockNotice" class="delete-block-notice"></div>

        <p id="deleteConfirmText">Do you want to continue and delete this user?</p>

        <div class="modal-btn-row">
            <button type="button" class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button type="button" id="confirmDeleteBtn" class="btn-danger" onclick="confirmDelete()">Delete User</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const userAssessmentsMap = /*[[${userAssessmentsMap}]]*/ {};
    const createdByAssessmentsMap = /*[[${createdByAssessmentsMap}]]*/ {};

    let pendingDeleteUrl = null;

    function openDeleteModal(event) {
        event.preventDefault();
        const target = event.currentTarget;
        const userId = target.getAttribute('data-user-id');
        const userName = target.getAttribute('data-user-name') || 'this user';

        pendingDeleteUrl = target.getAttribute('href');

        const assignedAssessments = userAssessmentsMap[userId] || [];
        const createdByAssessments = createdByAssessmentsMap[userId] || [];

        document.getElementById('deleteModalSummary').textContent = `You are about to delete ${userName}.`;
        renderAssessmentList('userAssessmentList', assignedAssessments);

        const createdByBlockNotice = document.getElementById('createdByBlockNotice');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const deleteConfirmText = document.getElementById('deleteConfirmText');

        if (createdByAssessments.length > 0) {
            createdByBlockNotice.style.display = 'block';
            createdByBlockNotice.innerHTML =
                'This user cannot be deleted because they are in the "created by" field of the following assessment(s):<br>' +
                buildAssessmentLinks(createdByAssessments);
            confirmDeleteBtn.style.display = 'none';
            deleteConfirmText.style.display = 'none';
        } else {
            createdByBlockNotice.style.display = 'none';
            createdByBlockNotice.innerHTML = '';
            confirmDeleteBtn.style.display = 'inline-block';
            deleteConfirmText.style.display = 'block';
        }

        document.getElementById('deleteModalBackdrop').style.display = 'flex';
        return false;
    }

    function renderAssessmentList(listId, assessments) {
        const listElement = document.getElementById(listId);
        listElement.innerHTML = '';

        if (!assessments || assessments.length === 0) {
            const item = document.createElement('li');
            item.textContent = 'No linked assessments found.';
            listElement.appendChild(item);
            return;
        }

        assessments.forEach(assessment => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = `/assessment/${assessment.id}`;
            link.textContent = `${assessment.name} (#${assessment.id})`;
            item.appendChild(link);
            listElement.appendChild(item);
        });
    }

    function buildAssessmentLinks(assessments) {
        return assessments
            .map(assessment => `<a href="/assessment/${assessment.id}">${assessment.name} (#${assessment.id})</a>`)
            .join('<br>');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModalBackdrop').style.display = 'none';
        pendingDeleteUrl = null;
    }

    function confirmDelete() {
        if (pendingDeleteUrl) {
            window.location.href = pendingDeleteUrl;
        }
    }

    document.getElementById('deleteModalBackdrop').addEventListener('click', function (event) {
        if (event.target.id === 'deleteModalBackdrop') {
            closeDeleteModal();
        }
    });
</script>
</body>
</html>
