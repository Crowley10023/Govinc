<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login - Govinc</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>

<body>
    <div class="login-container">
        <div class="landing-image">
            <img class="logo-login ci-logo-img-visible" th:if="${layoutConfig != null and layoutConfig.imageData != null and layoutConfig.imageData.length > 0}" src="/config/image-upload/preview"
                alt="Compliance Incubator Logo" />
            <img th:unless="${layoutConfig != null and layoutConfig.imageData != null and layoutConfig.imageData.length > 0}" src="/title.png"
                alt="Default Compliance Incubator Logo" class="ci-logo-img-visible" />
        </div>
        <h2>Login</h2>
        
        <!-- OAuth2 Error Display -->
        <div th:if="${errorMessage != null}" class="oauth2-error-box">
            <h3 th:text="${errorMessage}">Error</h3>
            <p th:text="${errorDetails}">Error details</p>
            <div class="error-code" th:if="${param.error != null}" th:text="'Error code: ' + ${param.error[0]}"></div>
            <div class="error-code" th:text="'Please check client secret'"></div>
        </div>
        
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error != null and errorMessage == null}" class="error-message">
                Invalid username or password.
            </div>
            <div th:if="${param.expired != null}" class="error-message" style="background:#fff3cd;border-color:#ffc107;color:#856404;">
                &#9201; Your session has expired. Please log in again.
            </div>
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <div class="or-separator">
            <span></span>
            <label>OR</label>
            <span></span>
        </div>
        <button class="oauth-btn oauth-keycloak" th:disabled="${!oauthProviders['keycloak']}"
            th:onclick="${oauthProviders['keycloak']} ? 'window.location=\'/oauth2/authorization/keycloak\'' : 'return false;'"
            type="button">Login with Keycloak</button>
        <button class="oauth-btn oauth-azure" th:disabled="${!oauthProviders['azure']}"
            th:onclick="${oauthProviders['azure']} ? 'window.location=\'/oauth2/authorization/azure\'' : 'return false;'"
            type="button">Login with Azure</button>
        
 
    </div>
</body>

</html>
