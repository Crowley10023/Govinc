<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Govinc</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 24px;
        }
        .login-container input[type=text], .login-container input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #3583ba;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .login-container button:hover {
            background-color: #25639a;
        }
        .or-separator {
            margin: 24px 0;
            display: flex;
            align-items: center;
        }
        .or-separator span {
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .or-separator label {
            margin: 0 15px;
            color: #888;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .error-message {
            color: #d63c3c;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <img src="/static/title.png" alt="Govinc" style="height:44px;margin-bottom:16px;">
    <h2>Login</h2>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="error-message">
            Invalid username or password.
        </div>
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <div class="or-separator">
        <span></span>
        <label>OR</label>
        <span></span>
    </div>
    <a href="/oauth2/authorization/keycloak" style="display:inline-block;text-decoration:none;padding:8px 0;width:100%;background:#49236d;color:#fff;border-radius:4px;font-weight:bold;font-size:1.07em;">Login with Keycloak</a>
</div>
</body>
</html>
