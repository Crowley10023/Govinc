<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${#strings.isEmpty(check.id) ? 'Create' : 'Edit'} + ' Compliance Check'"></title>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1 class="page-title" th:text="${#strings.isEmpty(check.id) ? 'Create' : 'Edit'} + ' Compliance Check'"></h1>
    <div style="max-width:900px;">
    <form th:action="@{/compliance/save}" method="post">
        <input type="hidden" name="id" th:value="${check.id}" />
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" th:value="${check.name}" required/>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" th:value="${check.description}" />
        </div>
        <div class="form-group">
            <label>Security Catalog</label>
            <select name="securityCatalogId" required>
                <option th:each="cat : ${catalogs}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == check.securityCatalog?.id}"></option>
            </select>
        </div>
        <hr/>
        <h3>Thresholds</h3>
        <div id="thresholds-list">
            <div th:each="thresh,iter : ${check.thresholds}" class="threshold-entry" style="display:flex;gap:0.7em;align-items:center;margin-bottom:0.7em;flex-wrap:wrap;">
                <select th:name="'thresholds[' + ${iter.index} + '].type'" style="flex:2;min-width:180px;">
                    <option th:selected="${thresh.type == 'ALL_ABOVE'}" value="ALL_ABOVE">All maturity answers above</option>
                    <option th:selected="${thresh.type == 'AVERAGE_ABOVE'}" value="AVERAGE_ABOVE">Average maturity answer above</option>
                </select>
                <input type="number" th:name="'thresholds[' + ${iter.index} + '].value'" th:value="${thresh.value}" style="width:70px;" min="0" max="100" required/>
                <span>%</span>
                <input type="text" th:name="'thresholds[' + ${iter.index} + '].ruleDescription'" th:value="${thresh.ruleDescription}" placeholder="Rule Description" required style="flex:3;min-width:160px;"/>
                <button type="button" class="btn-danger btn-sm" onclick="this.parentElement.remove();">Remove</button>
            </div>
        </div>
        <div style="margin:1em 0">
            <button type="button" class="btn-action" onclick="addThreshold();">Add Threshold</button>
        </div>
        <hr/>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Save</button>
            <a href="/compliance/checks" class="btn-cancel">Cancel</a>
        </div>
    </form>
    </div>
</div>
<script>
function addThreshold() {
    const container = document.getElementById('thresholds-list');
    let idx = container.children.length;
    let entry = document.createElement('div');
    entry.classList.add('threshold-entry');
    entry.style.cssText = 'display:flex;gap:0.7em;align-items:center;margin-bottom:0.7em;flex-wrap:wrap;';
    entry.innerHTML = `<select name="thresholds[${idx}].type" style="flex:2;min-width:180px;">
                    <option value="ALL_ABOVE">All maturity answers above</option>
                    <option value="AVERAGE_ABOVE">Average maturity answer above</option>
                </select>
                <input type="number" name="thresholds[${idx}].value" style="width:70px;" min="0" max="100" value="50" required/>
                <span>%</span>
                <input type="text" name="thresholds[${idx}].ruleDescription" placeholder="Rule Description" required style="flex:3;min-width:160px;"/>
                <button type="button" class="btn-danger btn-sm" onclick="this.parentElement.remove();">Remove</button>`;
    container.appendChild(entry);
}
</script>
</body>
</html>
