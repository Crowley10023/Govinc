<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Edit Security Catalog</title>
    <meta charset="UTF-8">
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1 class="page-title">Edit Security Catalog</h1>
    <form th:action="@{/security-catalog/edit}" th:object="${securityCatalog}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="catalog-edit-container">
            <!-- Left Column: General Information -->
            <div class="catalog-general-section">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" th:field="*{name}" id="name" required />
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea th:field="*{description}" id="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="revision">Revision</label>
                    <input type="text" th:field="*{revision}" id="revision" required />
                </div>

                <div class="form-group">
                    <label for="maturityModelId">Maturity Model</label>
                    <select id="maturityModelId" name="maturityModelId" required>
                        <option value="" disabled th:selected="${securityCatalog.maturityModel == null}">-- Select one --</option>
                        <option th:each="maturityModel : ${maturityModels}"
                                th:value="${maturityModel.id}"
                                th:text="${maturityModel.name}"
                                th:selected="${securityCatalog.maturityModel != null and maturityModel.id == securityCatalog.maturityModel.id}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reportInstructions">Report Instructions</label>
                    <textarea th:field="*{reportInstructions}" id="reportInstructions" placeholder="Enter detailed report instructions..."></textarea>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{versionManaged}" id="versionManaged" />
                        Version Managed
                    </label>
                    <p class="text-muted text-sm">When enabled, editing security controls in this catalog requires a governance project with change tracking.</p>
                </div>
            </div>

            <!-- Right Column: Security Controls -->
            <div class="catalog-controls-section">
                <div class="security-controls-section">
                    <div class="security-controls-section-header">
                        <h3>Security Controls</h3>
                    </div>

                    <div class="security-controls-filter-bar">
                        <div class="filter-input-wrapper">
                            <label for="controlFilter">Search:</label>
                            <input type="text" id="controlFilter" class="filter-input" placeholder="Search by control name or details..." />
                        </div>
                    </div>

                    <div class="security-controls-table-wrapper">
                        <table class="security-controls-table">
                            <tbody>
                                <th:block th:each="domain : ${securityControlDomains}">
                                    <tr class="security-controls-domain-header-row">
                                        <td colspan="3" th:text="${domain.name}"></td>
                                    </tr>
                                    <th:block th:each="control : ${domain.securityControls}">
                                        <tr class="security-control-row" th:data-name="${control.name}" th:data-detail="${control.detail}">
                                            <td class="security-control-checkbox-cell">
                                                <input type="checkbox"
                                                       name="securityControls"
                                                       th:value="${control.id}"
                                                       th:checked="${securityCatalog.securityControls != null and securityCatalog.securityControls.contains(control)}" />
                                            </td>
                                            <td class="security-control-name-cell" th:text="${control.name}"></td>
                                            <td class="security-control-detail-cell" th:text="${control.detail}"></td>
                                        </tr>
                                    </th:block>
                                </th:block>
                            </tbody>
                        </table>
                        <div id="noResults" class="no-results-found d-none">
                            No controls found matching your search.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions" style="margin-top:1.5em;">
            <button type="submit" class="btn-submit">Save</button>
            <a href="/security-catalog/list" class="btn-cancel">Cancel</a>
        </div>
    </form>

    <!-- Success Message -->
    <div th:if="${success}" class="success-message">
        Security Catalog saved successfully!
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const filterInput = document.getElementById('controlFilter');
        const controlRows = document.querySelectorAll('.security-control-row');
        const domainRows = document.querySelectorAll('.security-controls-domain-header-row');
        const noResultsDiv = document.getElementById('noResults');
        const table = document.querySelector('.security-controls-table');

        filterInput.addEventListener('keyup', function() {
            const filterText = filterInput.value.toLowerCase().trim();
            let visibleCount = 0;
            const visibleDomains = new Set();

            // First pass: determine which rows match and which domains are visible
            controlRows.forEach(row => {
                const name = row.getAttribute('data-name').toLowerCase();
                const detail = row.getAttribute('data-detail').toLowerCase();
                const matches = filterText === '' || name.includes(filterText) || detail.includes(filterText);
                
                if (matches) {
                    row.classList.remove('hidden');
                    visibleCount++;
                    // Mark all parent domains as visible
                    let prevElement = row.previousElementSibling;
                    while (prevElement) {
                        if (prevElement.classList.contains('security-controls-domain-header-row')) {
                            visibleDomains.add(prevElement);
                            break;
                        }
                        prevElement = prevElement.previousElementSibling;
                    }
                } else {
                    row.classList.add('hidden');
                }
            });

            // Show/hide domain headers
            domainRows.forEach(domainRow => {
                if (visibleDomains.has(domainRow)) {
                    domainRow.style.display = '';
                } else {
                    domainRow.style.display = 'none';
                }
            });

            // Show/hide no results message
            if (visibleCount === 0 && filterText !== '') {
                noResultsDiv.style.display = 'block';
            } else {
                noResultsDiv.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
