<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Not Authorized - Govinc</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/general.css">
    <th:block th:replace="~{fragments/theme-css :: themeCss}" />
    <style>
        .not-authorized-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .not-authorized-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #d63c3c;
        }

        .not-authorized-container h1 {
            color: #d63c3c;
            margin-bottom: 16px;
            font-size: 2.2em;
        }

        .not-authorized-container p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .authorization-details {
            background-color: #fde7e7;
            border: 1px solid #d63c3c;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .authorization-details h3 {
            color: #d63c3c;
            margin: 0 0 12px 0;
            font-size: 1.05em;
        }

        .authorization-details p {
            color: #333;
            margin: 8px 0;
            font-size: 0.95em;
        }

        .authorization-details ul {
            color: #333;
            font-size: 0.95em;
            margin: 8px 0;
            padding-left: 20px;
        }

        .authorization-details li {
            margin: 4px 0;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .action-button.primary {
            background-color: #3583ba;
            color: white;
        }

        .action-button.primary:hover {
            background-color: #25639a;
        }

        .action-button.secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .action-button.secondary:hover {
            background-color: #d0d0d0;
        }

        .status-code {
            color: #999;
            font-size: 0.9em;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .status-code strong {
            color: #d63c3c;
        }
    </style>
</head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="not-authorized-container">
        <div class="not-authorized-icon">⛔</div>
        <h1>Access Denied</h1>
        <p>You do not have the necessary permissions to access this page or perform this action.</p>

        <div class="authorization-details">
            <h3>Why am I seeing this?</h3>
            <p th:text="${message != null ? message : 'Your user account does not have the required permissions for this resource.'}"></p>
            
            <div th:if="${requiredRole != null}">
                <p style="margin-top: 16px;"><strong>Required permission:</strong> <code th:text="${requiredRole}"></code></p>
            </div>
        </div>

        <div class="button-group">
            <a href="/" class="action-button primary">Go to Home</a>
            <button type="button" class="action-button secondary" onclick="history.back()">Go Back</button>
        </div>

        <div class="status-code">
            <strong>403 - Forbidden</strong>
        </div>
    </div>
</body>
</html>
