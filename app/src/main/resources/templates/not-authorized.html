<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Not Authorized - Govinc</title>
    </head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="not-authorized-container">
        <div class="not-authorized-icon">⛔</div>
        <h1>Access Denied</h1>
        <p>You do not have the necessary permissions to access this page or perform this action.</p>

        <div class="authorization-details">
            <h3>Why am I seeing this?</h3>
            <p th:text="${message != null ? message : 'Your user account does not have the required permissions for this resource.'}"></p>
            
            <div th:if="${requiredRole != null}">
                <p class="required-perm"><strong>Required permission:</strong> <code th:text="${requiredRole}"></code></p>
            </div>
        </div>

        <div class="form-actions" style="justify-content:center;">
            <a href="/" class="btn-action">Go to Home</a>
            <button type="button" class="btn-cancel" onclick="history.back()">Go Back</button>
        </div>

        <div class="status-code">
            <strong>403 - Forbidden</strong>
        </div>
    </div>
</body>
</html>
