<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Organization Tree View</title>    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>

<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container org-tree-page">
    <div class="tree-header">
        <h1 class="page-title">Org Unit Tree View</h1>
        <p class="tree-caption">Click an org unit to drill into its direct children. Use the up arrow to navigate one level up.</p>
    </div>
    <div th:if="${treeApiUrl == null}">
        <p>No organization unit found for this ID.</p>
    </div>
    <div th:if="${treeApiUrl != null}">
        <div class="org-tree-container" id="treeViewport">
            <div class="nav-controls">
                <button id="navUpBtn" class="nav-up-btn" title="Remove current selection">Clear Selection</button>
                <select id="topLevelSelect" class="top-level-select" title="Choose top-level organization unit">
                    <option value="">Top-level...</option>
                </select>
                <span id="focusLabel" class="focus-label">Focused: -</span>
            </div>
            <svg id="orgTreeSvg" class="org-svg-tree" xmlns="http://www.w3.org/2000/svg" height="920" width="2200">
                <g id="orgTreeGroup"></g>
            </svg>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomInBtn" title="Zoom In">+</button>
                <div class="zoom-display" id="zoomLevel">100%</div>
                <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out">-</button>
                <button class="zoom-btn" id="resetZoomBtn" title="Reset View">Reset</button>
            </div>
        </div>
        <a th:href="@{'/orgunits/list'}" class="back-link">&larr; Back to Org Units List</a>
    </div>

    <div id="editModal" class="edit-modal" aria-hidden="true">
        <div class="edit-modal-content">
            <div class="edit-modal-bar">
                <span id="editModalTitle">Edit Organization Unit</span>
                <button id="closeEditModal" class="edit-modal-close" type="button">Close</button>
            </div>
            <div id="editModalBody" class="edit-modal-body"></div>
        </div>
    </div>

    <div id="dialogOverlay" class="dialog-overlay" aria-hidden="true">
        <div class="dialog-box">
            <div id="dialogTitle" class="dialog-title">Notice</div>
            <div id="dialogMessage" class="dialog-message"></div>
            <div id="dialogActions" class="dialog-actions"></div>
        </div>
    </div>

    <script>
        let panX = 0, panY = 0, zoomLevel = 1;
        let isPanning = false, startX = 0, startY = 0;
        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 3;
        const ZOOM_STEP = 0.1;

        const NODE_W = 280;
        const NODE_H = 152;
        const NODE_GAP = 5;
        const LEVEL_GAP = 220;
        const TOP_PAD_Y = 110;
        const PAD_X = 160;
        const EXTRA_SIBLING_UNITS = 0;
        const CONNECTOR_LANE_OFFSET = 38;

        const state = {
            rootId: null,
            focusId: null,
            treeApiUrl: '',
            nodesById: new Map(),
            parentById: new Map(),
            lastPositions: new Map(),
            treeLoaded: false
        };

        document.addEventListener('DOMContentLoaded', function () {
            const treeApiUrl = "[[${treeApiUrl != null ? treeApiUrl : ''}]]";
            if (!treeApiUrl) {
                return;
            }
            state.treeApiUrl = treeApiUrl;

            loadTreeFromBackend()
                .then(() => {
                    initPanZoomControls();
                    initDrillNavigation();
                    initEditModal();
                });
        });

        function loadTreeFromBackend() {
            if (!state.treeApiUrl) {
                return Promise.resolve();
            }

            return fetch(state.treeApiUrl)
                .then(resp => resp.json())
                .then(tree => {
                    const previousFocusId = state.focusId;
                    state.nodesById.clear();
                    state.parentById.clear();
                    indexTree(tree, null);
                    state.rootId = tree.id;
                    state.focusId = (previousFocusId !== null && state.nodesById.has(previousFocusId))
                        ? previousFocusId
                        : tree.id;
                    state.treeLoaded = true;
                    renderFocusedTree();
                })
                .catch(() => {
                    const label = document.getElementById('focusLabel');
                    if (label) {
                        label.textContent = 'Could not load org tree data.';
                    }
                });
        }

        function indexTree(node, parentId) {
            if (!node || node.id === null || node.id === undefined) {
                return;
            }

            if (!Array.isArray(node.children)) {
                node.children = [];
            }

            node.children.sort((a, b) => {
                const aName = (a && a.name ? a.name : '').toLowerCase();
                const bName = (b && b.name ? b.name : '').toLowerCase();
                return aName.localeCompare(bName);
            });

            state.nodesById.set(node.id, node);
            if (parentId !== null) {
                state.parentById.set(node.id, parentId);
            }

            node.children.forEach(child => indexTree(child, node.id));
        }

        function initDrillNavigation() {
            const navUpBtn = document.getElementById('navUpBtn');
            const topLevelSelect = document.getElementById('topLevelSelect');
            navUpBtn.addEventListener('click', () => {
                if (state.rootId !== null && state.focusId !== state.rootId) {
                    focusNode(state.rootId);
                }
            });

            topLevelSelect.addEventListener('change', () => {
                const selectedValue = topLevelSelect.value;
                if (!selectedValue) {
                    focusNode(state.rootId);
                    return;
                }
                const targetId = Number(selectedValue);
                if (!Number.isNaN(targetId) && state.nodesById.has(targetId)) {
                    focusNode(targetId);
                }
            });

            updateDrillControls();
        }

        function updateDrillControls() {
            const navUpBtn = document.getElementById('navUpBtn');
            const focusLabel = document.getElementById('focusLabel');
            const topLevelSelect = document.getElementById('topLevelSelect');
            const currentNode = state.nodesById.get(state.focusId);
            const rootNode = state.nodesById.get(state.rootId);

            navUpBtn.disabled = state.focusId === state.rootId;
            if (!currentNode) {
                focusLabel.textContent = 'Focused: -';
            } else if (isVirtualRoot(currentNode)) {
                focusLabel.textContent = 'Focused: Top-level Organisation Chart';
            } else {
                focusLabel.textContent = `Focused: ${currentNode.name}`;
            }

            if (topLevelSelect) {
                const rootChildren = rootNode && Array.isArray(rootNode.children) ? rootNode.children : [];
                const hasTopLevelChoice = isVirtualRoot(rootNode) && rootChildren.length > 0;
                topLevelSelect.style.display = hasTopLevelChoice ? 'inline-block' : 'none';
                if (hasTopLevelChoice) {
                    topLevelSelect.innerHTML = '';
                    const allOption = document.createElement('option');
                    allOption.value = '';
                    allOption.textContent = 'All Top-level';
                    topLevelSelect.appendChild(allOption);

                    rootChildren.forEach(child => {
                        const option = document.createElement('option');
                        option.value = String(child.id);
                        option.textContent = child.name || `Org ${child.id}`;
                        topLevelSelect.appendChild(option);
                    });

                    if (state.focusId === state.rootId) {
                        topLevelSelect.value = '';
                    } else if (state.parentById.get(state.focusId) === state.rootId) {
                        topLevelSelect.value = String(state.focusId);
                    }
                }
            }
        }

        function focusNode(nodeId) {
            if (!state.nodesById.has(nodeId)) {
                return;
            }
            state.focusId = nodeId;
            renderFocusedTree();
            centerFocusedView();
            updateDrillControls();
        }

        function renderFocusedTree() {
            if (!state.treeLoaded) {
                return;
            }

            const treeGroup = document.getElementById('orgTreeGroup');
            const svg = document.getElementById('orgTreeSvg');
            const focusNodeData = state.nodesById.get(state.focusId);
            if (!focusNodeData) {
                return;
            }

            treeGroup.innerHTML = '';

            const renderRoots = isVirtualRoot(focusNodeData)
                ? (focusNodeData.children || [])
                : [focusNodeData];

            const subtreeUnits = new Map();
            renderRoots.forEach(root => computeSubtreeUnits(root, subtreeUnits));
            const totalUnits = Math.max(
                1,
                renderRoots.reduce((sum, root, idx) => {
                    const rootUnits = subtreeUnits.get(root.id) || 1;
                    return sum + rootUnits + (idx > 0 ? EXTRA_SIBLING_UNITS * 2 : 0);
                }, 0)
            );
            const unitPx = NODE_W + NODE_GAP;
            const treeWidth = Math.max(1600, PAD_X * 2 + totalUnits * unitPx);

            const maxDepth = renderRoots.length === 0
                ? 0
                : Math.max(...renderRoots.map(getDepth));

            svg.setAttribute('width', String(treeWidth));

            const positions = new Map();
            let currentLeftUnits = 0;
            renderRoots.forEach(root => {
                const consumed = layoutSubtree(root, 0, currentLeftUnits, positions, subtreeUnits, unitPx);
                currentLeftUnits += consumed + EXTRA_SIBLING_UNITS * 2;
            });

            const maxY = positions.size > 0
                ? Math.max(...Array.from(positions.values()).map(pos => pos.y))
                : TOP_PAD_Y;
            const treeHeight = Math.max(
                520,
                maxY + NODE_H + 80,
                TOP_PAD_Y + (maxDepth + 1) * LEVEL_GAP + NODE_H + 80
            );
            svg.setAttribute('height', String(treeHeight));

            positions.forEach(({ node, x, y, depth }) => {
                const children = node.children || [];
                children.forEach(child => {
                    const childPos = positions.get(child.id);
                    if (childPos) {
                        drawRectangularLink(treeGroup, x, y + NODE_H, childPos.x, childPos.y, depth);
                    }
                });
            });

            positions.forEach(({ node, x, y }) => {
                const isFocus = !isVirtualRoot(focusNodeData) && node.id === focusNodeData.id;
                drawNodeCard(treeGroup, node, x, y, isFocus);
            });

            state.lastPositions = positions;

            updateDrillControls();
        }

        function centerFocusedView() {
            const viewport = document.getElementById('treeViewport');
            const focusedPos = state.lastPositions.get(state.focusId);
            if (!viewport || !focusedPos) {
                return;
            }

            const targetX = focusedPos.x;
            const targetY = focusedPos.y + NODE_H / 2;
            panX = viewport.clientWidth / 2 - targetX * zoomLevel;
            panY = viewport.clientHeight / 2 - targetY * zoomLevel;

            const treeGroup = document.getElementById('orgTreeGroup');
            if (treeGroup) {
                treeGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomLevel})`);
            }
        }

        function isVirtualRoot(node) {
            return node && Number(node.id) === 0;
        }

        function countLeaves(node) {
            const children = node && Array.isArray(node.children) ? node.children : [];
            if (children.length === 0) {
                return 1;
            }
            return children.reduce((sum, child) => sum + countLeaves(child), 0);
        }

        function getDepth(node) {
            const children = node && Array.isArray(node.children) ? node.children : [];
            if (children.length === 0) {
                return 0;
            }
            return 1 + Math.max(...children.map(getDepth));
        }

        // Calculates subtree width in abstract units where one leaf consumes one unit.
        // This guarantees sibling subtrees get separate, non-overlapping horizontal space.
        function computeSubtreeUnits(node, cache) {
            if (!node || node.id === null || node.id === undefined) {
                return 1;
            }
            if (cache.has(node.id)) {
                return cache.get(node.id);
            }

            const children = Array.isArray(node.children) ? node.children : [];
            if (children.length === 0) {
                cache.set(node.id, 1);
                return 1;
            }

            let total = 0;
            children.forEach((child, idx) => {
                total += computeSubtreeUnits(child, cache);
                if (idx > 0) {
                    total += EXTRA_SIBLING_UNITS;
                }
            });

            const units = Math.max(1, total);
            cache.set(node.id, units);
            return units;
        }

        // Returns the number of abstract units consumed by this subtree.
        function layoutSubtree(node, depth, leftUnits, positions, unitCache, unitPx) {
            const widthUnits = unitCache.get(node.id) || 1;
            const centerUnits = leftUnits + widthUnits / 2;
            const x = PAD_X + centerUnits * unitPx;
            const y = TOP_PAD_Y + depth * LEVEL_GAP;
            positions.set(node.id, { node, x, y, depth });

            let cursor = leftUnits;
            const children = node.children || [];
            children.forEach((child, idx) => {
                const childUnits = unitCache.get(child.id) || 1;
                layoutSubtree(child, depth + 1, cursor, positions, unitCache, unitPx);
                cursor += childUnits;
                if (idx < children.length - 1) {
                    cursor += EXTRA_SIBLING_UNITS;
                }
            });

            return widthUnits;
        }

        function drawRectangularLink(parent, x1, y1, x2, y2, depth) {
            const laneY = TOP_PAD_Y + depth * LEVEL_GAP + NODE_H + CONNECTOR_LANE_OFFSET;
            const midY = Math.min(laneY, y2 - 14);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${x1} ${y1} V ${midY} H ${x2} V ${y2}`);
            path.classList.add('org-link');
            parent.appendChild(path);
        }

        function drawNodeCard(parent, node, centerX, topY, isFocus) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', `translate(${centerX - NODE_W / 2}, ${topY})`);

            const shell = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            shell.setAttribute('width', String(NODE_W));
            shell.setAttribute('height', String(NODE_H));
            shell.setAttribute('rx', '12');
            shell.setAttribute('ry', '12');
            shell.setAttribute('fill', isFocus ? 'var(--focus)' : 'var(--panel)');
            shell.setAttribute('stroke', isFocus ? 'var(--primary)' : 'var(--panel-border)');
            shell.setAttribute('stroke-width', isFocus ? '2.6' : '1.5');
            shell.style.filter = 'drop-shadow(0 6px 10px rgba(36, 72, 100, 0.12))';
            g.appendChild(shell);

            const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bar.setAttribute('x', '0');
            bar.setAttribute('y', '0');
            bar.setAttribute('width', String(NODE_W));
            bar.setAttribute('height', '34');
            bar.setAttribute('rx', '12');
            bar.setAttribute('ry', '12');
            bar.setAttribute('fill', isFocus ? 'var(--primary)' : 'var(--accent)');
            g.appendChild(bar);

            addText(g, node.name || 'Unnamed Org Unit', 14, 22, {
                fill: '#ffffff',
                fontSize: '13',
                fontWeight: '700'
            });

            const wrappedNameLines = wrapText(node.name || 'Unnamed Org Unit', 30);
            wrappedNameLines.slice(0, 2).forEach((line, idx) => {
                addText(g, line, 16, 56 + idx * 17, {
                    fill: '#1f3647',
                    fontSize: '13',
                    fontWeight: idx === 0 ? '700' : '600'
                });
            });

            const leaderName = node.leader && node.leader.name ? node.leader.name : 'Unassigned';
            addText(g, leaderName, 16, 92, {
                fill: '#314e63',
                fontSize: '12',
                fontWeight: '500'
            });

            const assessmentLink = addText(g, 'Latest assessment', 16, 134, {
                fill: 'var(--link)',
                fontSize: '12',
                fontWeight: '700',
                textDecoration: 'underline',
                cursor: 'pointer'
            });
            assessmentLink.classList.add('node-interactive');
            assessmentLink.addEventListener('click', function (event) {
                event.stopPropagation();
                window.location.href = `/assessment/list?orgUnit=${node.id}`;
            });

            const editBtn = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            editBtn.setAttribute('x', String(NODE_W - 76));
            editBtn.setAttribute('y', '118');
            editBtn.setAttribute('width', '60');
            editBtn.setAttribute('height', '24');
            editBtn.setAttribute('rx', '6');
            editBtn.setAttribute('ry', '6');
            editBtn.setAttribute('fill', '#f0f7ff');
            editBtn.setAttribute('stroke', '#b7d0ea');
            editBtn.setAttribute('stroke-width', '1.3');
            editBtn.style.cursor = 'pointer';
            editBtn.classList.add('node-interactive');
            editBtn.addEventListener('click', function (event) {
                event.stopPropagation();
                openEditModal(node);
            });
            g.appendChild(editBtn);

            const editLabel = addText(g, 'Edit', NODE_W - 46, 134, {
                fill: '#245277',
                fontSize: '12',
                fontWeight: '700',
                textAnchor: 'middle',
                cursor: 'pointer'
            });
            editLabel.classList.add('node-interactive');
            editLabel.addEventListener('click', function (event) {
                event.stopPropagation();
                openEditModal(node);
            });

            const addChildBtn = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            addChildBtn.setAttribute('x', String(NODE_W - 30));
            addChildBtn.setAttribute('y', '8');
            addChildBtn.setAttribute('width', '20');
            addChildBtn.setAttribute('height', '20');
            addChildBtn.setAttribute('rx', '5');
            addChildBtn.setAttribute('ry', '5');
            addChildBtn.setAttribute('fill', '#ffffff');
            addChildBtn.setAttribute('stroke', '#d0deec');
            addChildBtn.setAttribute('stroke-width', '1.2');
            addChildBtn.style.cursor = 'pointer';
            addChildBtn.classList.add('node-interactive');
            addChildBtn.addEventListener('click', function (event) {
                event.stopPropagation();
                openCreateChildModal(node);
            });
            g.appendChild(addChildBtn);

            const addChildLabel = addText(g, '+', NODE_W - 20, 23, {
                fill: '#1f5a85',
                fontSize: '16',
                fontWeight: '700',
                textAnchor: 'middle',
                cursor: 'pointer'
            });
            addChildLabel.classList.add('node-interactive');
            addChildLabel.addEventListener('click', function (event) {
                event.stopPropagation();
                openCreateChildModal(node);
            });

            const deleteBtn = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            deleteBtn.setAttribute('x', String(NODE_W - 142));
            deleteBtn.setAttribute('y', '118');
            deleteBtn.setAttribute('width', '60');
            deleteBtn.setAttribute('height', '24');
            deleteBtn.setAttribute('rx', '6');
            deleteBtn.setAttribute('ry', '6');
            deleteBtn.setAttribute('fill', '#fff3f4');
            deleteBtn.setAttribute('stroke', '#efb8bf');
            deleteBtn.setAttribute('stroke-width', '1.2');
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.classList.add('node-interactive');
            deleteBtn.addEventListener('click', function (event) {
                event.stopPropagation();
                requestDeleteOrgUnit(node);
            });
            g.appendChild(deleteBtn);

            const deleteLabel = addText(g, 'Delete', NODE_W - 112, 134, {
                fill: '#a21a2b',
                fontSize: '12',
                fontWeight: '700',
                textAnchor: 'middle',
                cursor: 'pointer'
            });
            deleteLabel.classList.add('node-interactive');
            deleteLabel.addEventListener('click', function (event) {
                event.stopPropagation();
                requestDeleteOrgUnit(node);
            });

            g.style.cursor = 'pointer';
            g.classList.add('node-interactive');
            g.addEventListener('click', function () {
                focusNode(node.id);
            });

            parent.appendChild(g);
        }

        function addText(parent, text, x, y, style) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            el.setAttribute('x', String(x));
            el.setAttribute('y', String(y));
            el.textContent = text;

            if (style.fill) el.setAttribute('fill', style.fill);
            if (style.fontSize) el.setAttribute('font-size', style.fontSize);
            if (style.fontWeight) el.setAttribute('font-weight', style.fontWeight);
            if (style.textAnchor) el.setAttribute('text-anchor', style.textAnchor);
            if (style.textDecoration) el.setAttribute('text-decoration', style.textDecoration);
            if (style.cursor) el.style.cursor = style.cursor;
            el.setAttribute('font-family', 'Segoe UI, Arial, sans-serif');

            parent.appendChild(el);
            return el;
        }

        function wrapText(text, maxCharsPerLine) {
            const words = String(text || '').split(/\s+/).filter(Boolean);
            if (words.length === 0) {
                return [''];
            }

            const lines = [];
            let current = '';
            words.forEach(word => {
                const trial = current ? `${current} ${word}` : word;
                if (trial.length <= maxCharsPerLine) {
                    current = trial;
                } else {
                    if (current) {
                        lines.push(current);
                    }
                    current = word;
                }
            });
            if (current) {
                lines.push(current);
            }
            return lines;
        }

        function initEditModal() {
            const editModal = document.getElementById('editModal');
            const closeEditModalBtn = document.getElementById('closeEditModal');

            closeEditModalBtn.addEventListener('click', closeEditModal);
            editModal.addEventListener('click', function (event) {
                if (event.target === editModal) {
                    closeEditModal();
                }
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    closeEditModal();
                }
            });

            window.addEventListener('message', function (event) {
                if (event.origin !== window.location.origin) {
                    return;
                }
                if (!event.data || event.data.type !== 'orgunitSaved') {
                    if (event.data && event.data.type === 'orgunitEditCancelled') {
                        closeEditModal();
                    }
                    return;
                }

                closeEditModal();
                loadTreeFromBackend();
            });
        }

        function openEditModal(node) {
            const editModal = document.getElementById('editModal');
            const editModalTitle = document.getElementById('editModalTitle');
            const editModalBody = document.getElementById('editModalBody');
            editModalTitle.textContent = `Edit Organization Unit: ${node.name}`;
            editModal.classList.add('open');
            editModal.setAttribute('aria-hidden', 'false');

            editModalBody.innerHTML = '<div class="edit-modal-loading">Loading organization unit form...</div>';
            fetch(`/orgunits/edit/${node.id}?embed=true`, { credentials: 'same-origin' })
                .then(response => response.text())
                .then(html => {
                    renderEmbeddedEditForm(html);
                })
                .catch(() => {
                    editModalBody.innerHTML = '<div class="edit-modal-error">Could not load edit form.</div>';
                });
        }

        function openCreateChildModal(parentNode) {
            const editModal = document.getElementById('editModal');
            const editModalTitle = document.getElementById('editModalTitle');
            const editModalBody = document.getElementById('editModalBody');
            editModalTitle.textContent = `Create Child Org Unit for: ${parentNode.name}`;
            editModal.classList.add('open');
            editModal.setAttribute('aria-hidden', 'false');

            editModalBody.innerHTML = '<div class="edit-modal-loading">Loading create form...</div>';
            fetch(`/orgunits/create?embed=true&parentId=${parentNode.id}`, { credentials: 'same-origin' })
                .then(response => response.text())
                .then(html => {
                    renderEmbeddedEditForm(html);
                    const form = editModalBody.querySelector('form');
                    if (form) {
                        const nameInput = form.querySelector('input[name="name"]');
                        if (nameInput) {
                            nameInput.focus();
                        }
                    }
                })
                .catch(() => {
                    editModalBody.innerHTML = '<div class="edit-modal-error">Could not load create form.</div>';
                });
        }

        function closeEditModal() {
            const editModal = document.getElementById('editModal');
            const editModalBody = document.getElementById('editModalBody');
            editModalBody.innerHTML = '';
            editModal.classList.remove('open');
            editModal.setAttribute('aria-hidden', 'true');
        }

        function renderEmbeddedEditForm(html) {
            const editModalBody = document.getElementById('editModalBody');
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const formContainer = doc.querySelector('.form-container');

            if (!formContainer) {
                editModalBody.innerHTML = '<div class="edit-modal-error">Could not render edit form.</div>';
                return;
            }

            editModalBody.innerHTML = '';
            editModalBody.appendChild(formContainer.cloneNode(true));

            const form = editModalBody.querySelector('form');
            if (form) {
                if (!form.querySelector('input[name="embed"]')) {
                    const embedInput = document.createElement('input');
                    embedInput.type = 'hidden';
                    embedInput.name = 'embed';
                    embedInput.value = 'true';
                    form.appendChild(embedInput);
                }
                form.addEventListener('submit', onEmbeddedFormSubmit);
            }

            const cancelLink = editModalBody.querySelector('#cancelOrgUnitEdit') || editModalBody.querySelector('.btn-secondary');
            if (cancelLink) {
                cancelLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    closeEditModal();
                });
            }
        }

        function onEmbeddedFormSubmit(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) {
                submitBtn.disabled = true;
            }

            const action = form.getAttribute('action') || '/orgunits/save';
            const formData = new FormData(form);
            if (!formData.has('embed')) {
                formData.append('embed', 'true');
            }

            fetch(action, {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.text())
            .then(html => {
                if (html.includes('orgunitSaved')) {
                    closeEditModal();
                    loadTreeFromBackend();
                    return;
                }
                renderEmbeddedEditForm(html);
            })
            .catch(() => {
                const editModalBody = document.getElementById('editModalBody');
                editModalBody.innerHTML = '<div class="edit-modal-error">Save failed. Please retry.</div>';
            })
            .finally(() => {
                if (submitBtn && document.body.contains(submitBtn)) {
                    submitBtn.disabled = false;
                }
            });
        }

        function requestDeleteOrgUnit(node) {
            const hasChildren = node.children && node.children.length > 0;
            if (hasChildren) {
                showInfoDialog('Delete not allowed', 'This org unit cannot be deleted because it has children.');
                return;
            }

            showConfirmDialog('Delete org unit', `Delete org unit "${node.name}"?`, {
                confirmLabel: 'Delete',
                danger: true
            }).then((confirmed) => {
                if (!confirmed) {
                    return;
                }

                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
                const headers = {
                    'Accept': 'application/json'
                };
                if (csrfToken) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch(`/orgunits/${node.id}`, {
                    method: 'DELETE',
                    credentials: 'same-origin',
                    headers
                })
                    .then(async (resp) => {
                        let payload = null;
                        try {
                            payload = await resp.json();
                        } catch (e) {
                            payload = null;
                        }

                        if (!resp.ok) {
                            const message = payload && payload.message ? payload.message : 'Delete failed.';
                            throw new Error(message);
                        }
                        return payload;
                    })
                    .then(() => {
                        const fallbackFocus = state.parentById.get(node.id) || state.rootId;
                        loadTreeFromBackend().then(() => {
                            if (state.nodesById.has(fallbackFocus)) {
                                focusNode(fallbackFocus);
                            }
                        });
                    })
                    .catch((err) => {
                        showInfoDialog('Delete failed', err.message || 'Delete failed.');
                    });
            });
        }

        function showInfoDialog(title, message) {
            return showDialog(title, message, [
                { label: 'OK', value: true, className: 'primary' }
            ]);
        }

        function showConfirmDialog(title, message, options) {
            const confirmLabel = options && options.confirmLabel ? options.confirmLabel : 'Confirm';
            const confirmClass = options && options.danger ? 'danger' : 'primary';
            return showDialog(title, message, [
                { label: 'Cancel', value: false, className: '' },
                { label: confirmLabel, value: true, className: confirmClass }
            ]);
        }

        function showDialog(title, message, actions) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('dialogOverlay');
                const dialogTitle = document.getElementById('dialogTitle');
                const dialogMessage = document.getElementById('dialogMessage');
                const dialogActions = document.getElementById('dialogActions');

                dialogTitle.textContent = title;
                dialogMessage.textContent = message;
                dialogActions.innerHTML = '';

                const close = (value) => {
                    overlay.classList.remove('open');
                    overlay.setAttribute('aria-hidden', 'true');
                    resolve(value);
                };

                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `dialog-btn${action.className ? ' ' + action.className : ''}`;
                    btn.textContent = action.label;
                    btn.addEventListener('click', () => close(action.value));
                    dialogActions.appendChild(btn);
                });

                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
            });
        }

        function initPanZoomControls() {
            const svg = document.getElementById('orgTreeSvg');
            const treeGroup = document.getElementById('orgTreeGroup');
            const viewport = document.getElementById('treeViewport');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetZoomBtn = document.getElementById('resetZoomBtn');
            const zoomDisplay = document.getElementById('zoomLevel');

            // Zoom controls
            zoomInBtn.addEventListener('click', () => {
                zoomLevel = Math.min(zoomLevel + ZOOM_STEP, MAX_ZOOM);
                updateTransform();
                updateZoomDisplay();
            });

            zoomOutBtn.addEventListener('click', () => {
                zoomLevel = Math.max(zoomLevel - ZOOM_STEP, MIN_ZOOM);
                updateTransform();
                updateZoomDisplay();
            });

            resetZoomBtn.addEventListener('click', () => {
                panX = 0;
                panY = 0;
                zoomLevel = 1;
                updateTransform();
                updateZoomDisplay();
            });

            // Mouse wheel zoom
            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = svg.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const oldZoom = zoomLevel;
                zoomLevel = e.deltaY > 0 
                    ? Math.max(zoomLevel - ZOOM_STEP, MIN_ZOOM)
                    : Math.min(zoomLevel + ZOOM_STEP, MAX_ZOOM);

                // Adjust pan to zoom toward mouse position
                panX -= mouseX * (zoomLevel - oldZoom) / oldZoom;
                panY -= mouseY * (zoomLevel - oldZoom) / oldZoom;

                updateTransform();
                updateZoomDisplay();
            }, { passive: false });

            svg.addEventListener('mousedown', (e) => {
                if (e.button !== 0) {
                    return;
                }
                if (e.target && e.target.closest && e.target.closest('.node-interactive')) {
                    return;
                }
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                svg.classList.add('grabbing');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            });

            document.addEventListener('mouseup', () => {
                isPanning = false;
                svg.classList.remove('grabbing');
            });

            function updateTransform() {
                treeGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomLevel})`);
            }

            function updateZoomDisplay() {
                zoomDisplay.textContent = Math.round(zoomLevel * 100) + '%';
            }

            updateTransform();
            updateZoomDisplay();
        }
    </script>
</div>
