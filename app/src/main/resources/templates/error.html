<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Error</title>
    <meta charset="UTF-8">
    <th:block th:replace="~{navigation :: navHead}"></th:block></head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1 class="page-title">An error occurred</h1>
    <p th:text="${message}"></p>
    <div th:if="${showDetails}">
        <h2>Error Details</h2>
        <pre th:text="${details}"></pre>
    </div>
    <a href="/" class="back-link">Back to Landing Page</a>
</div>
</body>
</html>
