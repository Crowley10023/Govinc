<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Org Service List</title>    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script>
      function getCsrfHeader() {
        var header = document.querySelector('meta[name="_csrf_header"]');
        var token = document.querySelector('meta[name="_csrf"]');
        return header && token ? {[header.content]: token.content} : {};
      }
      function confirmDeleteOrgService(orgServiceId, orgServiceName) {
          document.getElementById('deleteModal').style.display = 'flex';
          document.getElementById('modal-delete-msg').innerText = 'Delete Org Service "' + orgServiceName + '" and all its assessments?';
          var confirmBtn = document.getElementById('modal-confirm-delete');
          confirmBtn.disabled = false;
          confirmBtn.onclick = function() {
              confirmBtn.disabled = true;
              fetch('/orgservices/' + orgServiceId, {
                method: 'DELETE',
                headers: getCsrfHeader()
              })
                .then(function(r) {
                  if (!r.ok) throw new Error('Failed to delete');
                  window.location.reload();
                })
                .catch(function(err) {
                  confirmBtn.disabled = false;
                  alert('Error deleting Org Service: ' + err);
                });
          };
      }
      function closeModal() {
        document.getElementById('deleteModal').style.display = 'none';
      }
    </script>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <div class="orgservice-header">
        <h1>Org Services</h1>
        <a th:href="@{'/orgservices/create'}" class="btn-action">+ Create New Org Service</a>
    </div>

    <table class="table card">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Org Units</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="orgService : ${orgServices}">
                <td th:text="${orgService.name}"></td>
                <td th:text="${orgService.description != null} ? ${orgService.description} : ''"></td>
                <td>
                    <span th:each="unit, s : ${orgService.orgUnits}">
                        <span th:text="${unit.name}"></span><span th:unless="${s.last}">, </span>
                    </span>
                    <span th:if="${orgService.orgUnits.isEmpty()}" class="text-muted">—</span>
                </td>
                <td>
                    <a th:href="@{'/orgservices/edit/' + ${orgService.id}}" class="btn-edit">Edit</a>
                    <a th:href="@{|/orgservice-assessment/edit/${orgService.id}|}" class="btn-action">Assess</a>
                    <button type="button" class="btn-danger"
                            th:attr="data-orgservice-id=${orgService.id},data-orgservice-name=${orgService.name}"
                            onclick="confirmDeleteOrgService(this.getAttribute('data-orgservice-id'), this.getAttribute('data-orgservice-name'))">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Empty state message -->
    <div th:if="${orgServices.isEmpty()}" class="no-results-found">
        <p>No org services found. <a th:href="@{'/orgservices/create'}">Create one now</a></p>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-bg">
      <div class="modal-popup-confirmation">
        <h3>Confirm Delete</h3>
        <p id="modal-delete-msg">Are you sure?</p>
        <div class="modal-btn-row">
            <button id="modal-confirm-delete" class="btn-danger">Yes, delete</button>
            <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
</div>
</body>
</html>
