<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Landing Page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/general.css">
</head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <!-- Main Content Grid -->
        <div class="landing-grid">
            <!-- Latest Assessments Card -->
            <div class="landing-card">
                <div class="card-header">
                    <h2>Latest Assessments</h2>
                </div>
                <div class="card-body">
                    <div th:if="${latestAssessments != null and #lists.isEmpty(latestAssessments)}" class="empty-state">
                        <p>No assessments found.</p>
                    </div>
                    <ul class="assessment-list" th:if="${latestAssessments != null and !#lists.isEmpty(latestAssessments)}">
                        <li th:each="assessment : ${latestAssessments}" class="assessment-item">
                            <a th:href="@{/assessment/{id}(id=${assessment.id})}" th:text="${assessment.name}" class="assessment-link"></a>
                            <div class="assessment-meta">
                                <span class="assessment-org" th:text="${assessment.orgUnit != null ? assessment.orgUnit.name : 'N/A'}"></span>
                                <span class="assessment-date" th:text="${assessment.date != null ? #temporals.format(assessment.date, 'yyyy-MM-dd') : 'N/A'}"></span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Tasks Card -->
            <div class="landing-card">
                <div class="card-header">
                    <h2>Tasks</h2>
                </div>
                <div class="card-body">
                    <p class="coming-soon">Coming soon.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
