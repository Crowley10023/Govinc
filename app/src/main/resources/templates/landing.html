<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Landing Page</title>
    <meta charset="UTF-8">
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>

    <div class="landing-container">
        <!-- Main Content Grid -->

        <!-- Latest Assessments Card -->
        <div class="landing-card">
            <div class="card-header">
                <div class="card-icon-row">
                    <div class="card-icon">📋</div>
                    <h2>Latest Assessments</h2>
                </div>
            </div>
            <div class="card-body">
                <!-- Small filter bar (client-side, remembers choices in localStorage) -->
                <div class="filter-bar">
                    <select id="filter-range" class="tiny" title="Date range">
                        <option value="">All time</option>
                        <option value="1">Last month</option>
                        <option value="3">Last 3 months</option>
                        <option value="12">Last 12 months</option>
                    </select>

                    <select id="filter-status" class="tiny">
                        <option value="">All statuses</option>
                        <option value="OPEN">Open</option>
                        <option value="CLOSED">Closed</option>
                    </select>

                    <select id="filter-user" class="tiny">
                        <option value="">All users</option>
                        <option th:each="u : ${filterUsers}" th:value="${u.name}" th:text="${u.name}"></option>
                    </select>

                    <select id="filter-catalog" class="tiny">
                        <option value="">All catalogs</option>
                        <option th:each="c : ${filterCatalogs}" th:value="${c.name}" th:text="${c.name}"></option>
                    </select>

                    <button id="filter-apply" class="btn-action btn-sm">Apply</button>
                    <button id="filter-clear" class="btn-cancel btn-sm">Clear</button>
                </div>

                <div th:if="${latestAssessments != null and #lists.isEmpty(latestAssessments)}" class="empty-state">
                    <p>No assessments found yet. Start creating assessments to see them here.</p>
                </div>

                <ul class="assessment-list" th:if="${latestAssessments != null and !#lists.isEmpty(latestAssessments)}">
                    <li th:each="assessment : ${latestAssessments}" class="assessment-item"
                        th:attr="data-creation-date=${assessment.creationDate != null ? #temporals.format(assessment.creationDate,'yyyy-MM-dd') : ''}, data-status=${assessment.status}, data-security=${assessment.securityCatalog != null ? assessment.securityCatalog.name : ''}, data-users=${assessment.createdBy != null ? assessment.createdBy.name : ''}">

                        <a th:href="@{/assessment/{id}(id=${assessment.id})}" class="assessment-link">
                            <span th:text="${assessment.name}" class="assessment-title"></span>

                            <div class="assessment-meta">
                                <span class="assessment-org"
                                    th:text="${assessment.orgUnit != null ? assessment.orgUnit.name : 'N/A'}"></span>
                                <span class="assessment-date"
                                    th:text="${assessment.creationDate != null ? #temporals.format(assessment.creationDate, 'yyyy-MM-dd') : 'N/A'}"></span>
                            </div>

                            <!-- Hidden: render other involved users (if any) for client-side collection -->
                            <div class="involved-users d-none">
                                <span th:each="u : ${assessment.users}" th:text="${u.name}"></span>
                            </div>
                        </a>

                        <!-- Right side: completion bar and leader -->
                        <div class="assessment-side">
                            <div class="team-leader"
                                th:text="${assessmentTeamLeaders[assessment.id] != null ? assessmentTeamLeaders[assessment.id] : ''}"></div>
                            <div class="completion-bar-wrapper" title="Completion">
                                <div class="completion-bar-container">
                                    <div class="completion-bar-fill"
                                        th:style="'width:' + (${assessmentCompletionPercent[assessment.id] != null ? (assessmentCompletionPercent[assessment.id] > 100 ? 100 : assessmentCompletionPercent[assessment.id]) : 0}) + '%'">
                                    </div>
                                </div>
                            </div>

                        </div>
            </div>

            </li>
            </ul>

            <script>
                (function () {
                    function $(s, ctx) { return (ctx || document).querySelector(s); }
                    function $all(s, ctx) { return Array.from((ctx || document).querySelectorAll(s)); }

                    document.addEventListener('DOMContentLoaded', function () {
                        var list = $('.assessment-list');
                        if (!list) return;
                        var items = $all('.assessment-item', list);

                        var userSelect = $('#filter-user');
                        var catalogSelect = $('#filter-catalog');

                        // Note: users and catalogs are populated server-side via model attributes (filterUsers, filterCatalogs)

                        // Load saved filters (range, status, user, catalog)
                        var saved = {};
                        try { saved = JSON.parse(localStorage.getItem('landing_assessment_filters') || '{}'); } catch (e) { saved = {}; }
                        if (saved.range) $('#filter-range').value = saved.range;
                        if (saved.status) $('#filter-status').value = saved.status;
                        if (saved.user) $('#filter-user').value = saved.user;
                        if (saved.catalog) $('#filter-catalog').value = saved.catalog;

                        function applyFilters(save) {
                            var range = $('#filter-range').value || '';
                            var status = $('#filter-status').value || '';
                            var user = $('#filter-user').value || '';
                            var catalog = $('#filter-catalog').value || '';

                            // map range value to days
                            var days = 0;
                            if (range === '1') days = 30;
                            if (range === '3') days = 90;
                            if (range === '12') days = 365;

                            var threshold = null;
                            if (days > 0) {
                                threshold = new Date();
                                threshold.setHours(0, 0, 0, 0);
                                threshold.setDate(threshold.getDate() - days);
                            }

                            items.forEach(function (li) {
                                var visible = true;

                                var dateStr = (li.getAttribute('data-creation-date') || '').toString().trim();
                                if (dateStr && threshold) {
                                    var d = new Date(dateStr);
                                    if (isNaN(d.getTime())) {
                                        // try parsing yyyy-MM-dd manually
                                        var parts = dateStr.split('-');
                                        if (parts.length >= 3) { d = new Date(parts[0], parts[1] - 1, parts[2]); }
                                    }
                                    if (!isNaN(d.getTime()) && d < threshold) visible = false;
                                }

                                var s = (li.getAttribute('data-status') || '').toString().trim();
                                if (status && s !== status) visible = false;

                                var usersAttr = (li.getAttribute('data-users') || '').toString().trim();
                                var extraUsers = $all('div.involved-users span', li).map(function (sp) { return sp.textContent.trim(); }).filter(Boolean);
                                var allUsers = usersAttr ? [usersAttr].concat(extraUsers) : extraUsers;
                                if (user) {
                                    if (!allUsers.some(function (u) { return u === user; })) visible = false;
                                }

                                var sec = (li.getAttribute('data-security') || '').toString().trim();
                                if (catalog && sec !== catalog) visible = false;

                                li.style.display = visible ? '' : 'none';
                            });

                            if (save) {
                                try { localStorage.setItem('landing_assessment_filters', JSON.stringify({ range: range, status: status, user: user, catalog: catalog })); } catch (e) { }
                            }
                        }

                        $('#filter-apply').addEventListener('click', function (e) { e.preventDefault(); applyFilters(true); });
                        $('#filter-clear').addEventListener('click', function (e) {
                            e.preventDefault();
                            // Reset all filter controls to their default (no filter) state
                            $('#filter-range').value = '';
                            $('#filter-status').value = '';
                            $('#filter-user').value = '';
                            $('#filter-catalog').value = '';

                            // Remove any previously saved filters so a reload starts clean
                            try { localStorage.removeItem('landing_assessment_filters'); } catch (e) { }

                            // Re-apply filters with a fully cleared state
                            applyFilters(false);
                        });

                        // Apply on load
                        applyFilters(false);
                    });
                })();
            </script>
</div>


        <!-- Tasks Card -->
        <div class="landing-card">
            <div class="card-header">
                <div class="card-icon-row">
                    <div class="card-icon">✓</div>
                    <h2>My Tasks</h2>
                </div>
            </div>
            <div class="card-body">
                <div th:if="${myTasks == null or #lists.isEmpty(myTasks)}" class="empty-state">
                    <p>No tasks assigned to you.</p>
                </div>
                <ul class="assessment-list" th:if="${myTasks != null and !#lists.isEmpty(myTasks)}">
                    <li th:each="task : ${myTasks}" th:if="${task.status.name() != 'DONE'}" class="assessment-item">
                        <div class="assessment-link" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;">
                            <div>
                                <span class="assessment-title" th:text="${task.title}"></span>
                                <div class="assessment-meta">
                                    <span class="task-status-badge"
                                          th:classappend="${task.status.name() == 'DONE' ? 'status-done' : (task.status.name() == 'IN_PROGRESS' ? 'status-inprogress' : (task.status.name() == 'READY_FOR_APPROVAL' ? 'status-approval' : 'status-identified'))}"
                                          th:text="${task.status.displayName}"></span>
                                    <span th:if="${task.project != null}" class="assessment-org" th:text="'Project: ' + ${task.project.name}"></span>
                                    <span th:if="${task.dueDate != null}" class="assessment-date" th:text="'Due: ' + ${#temporals.format(task.dueDate, 'yyyy-MM-dd')}"></span>
                                </div>
                            </div>
                            <a th:href="@{/governance/tasks}" class="btn-action btn-sm">View</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    </div>

</body>

</html>
