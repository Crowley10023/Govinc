<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Landing Page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/general.css">
</head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <!-- Main Content Grid -->
        <div class="landing-grid">
            <!-- Latest Assessments Card -->
            <div class="landing-card">
                <div class="card-header">
                    <h2>Latest Assessments</h2>
                </div>
                <div class="card-body">
                    <div th:if="${latestAssessments != null and #lists.isEmpty(latestAssessments)}" class="empty-state">
                        <p>No assessments found.</p>
                    </div>
                    <ul class="assessment-list" th:if="${latestAssessments != null and !#lists.isEmpty(latestAssessments)}">
                        <li th:each="assessment : ${latestAssessments}" class="assessment-item">
                            <a th:href="@{/assessment/{id}(id=${assessment.id})}" th:text="${assessment.name}" class="assessment-link"></a>
                            <div class="assessment-meta">
                                <span class="assessment-org" th:text="${assessment.orgUnit != null ? assessment.orgUnit.name : 'N/A'}"></span>
                                <span class="assessment-date" th:text="${assessment.date != null ? #temporals.format(assessment.date, 'yyyy-MM-dd') : 'N/A'}"></span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Tasks Card -->
            <div class="landing-card">
                <div class="card-header">
                    <h2>Tasks</h2>
                </div>
                <div class="card-body">
                    <p class="coming-soon">Coming soon.</p>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Landing Page Specific Styles */
        .landing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5em;
            margin-bottom: 2.5em;
        }

        .landing-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(34, 116, 165, 0.08);
            border: 1px solid rgba(34, 116, 165, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .landing-card:hover {
            box-shadow: 0 4px 16px rgba(34, 116, 165, 0.12);
            border-color: rgba(34, 116, 165, 0.2);
        }

        .landing-card .card-header {
            background: linear-gradient(135deg, rgba(34, 116, 165, 0.08) 0%, rgba(255, 149, 5, 0.05) 100%);
            padding: 1.5em;
            border-bottom: 1px solid rgba(34, 116, 165, 0.1);
        }

        .landing-card .card-header h2 {
            margin: 0;
            color: var(--primary-blue-dark);
            font-size: 1.1em;
            font-weight: 600;
        }

        .landing-card .card-body {
            padding: 1.2em;
            flex: 1;
        }

        .assessment-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .assessment-item {
            padding: 0.8em;
            background: rgba(34, 116, 165, 0.02);
            border: 1px solid rgba(34, 116, 165, 0.1);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .assessment-item:hover {
            background: rgba(34, 116, 165, 0.05);
            border-color: rgba(34, 116, 165, 0.2);
        }

        .assessment-link {
            display: block;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 0.4em;
            transition: color 0.2s ease;
        }

        .assessment-link:hover {
            color: var(--primary-blue-dark);
            text-decoration: underline;
        }

        .assessment-meta {
            display: flex;
            gap: 1em;
            font-size: 0.85em;
            color: #666;
        }

        .assessment-org,
        .assessment-date {
            display: inline-flex;
            align-items: center;
        }

        .assessment-org::before {
            content: '🏢';
            margin-right: 0.4em;
        }

        .assessment-date::before {
            content: '📅';
            margin-right: 0.4em;
        }

        .coming-soon {
            margin: 0;
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 2em 0;
            font-size: 1em;
        }

        .quick-actions-section {
            margin-top: 1.5em;
            padding-top: 1.5em;
            border-top: 2px solid rgba(34, 116, 165, 0.15);
        }

        .quick-actions-section h2 {
            margin: 0 0 1.2em 0;
            color: var(--primary-blue-dark);
            font-size: 1.2em;
            font-weight: 600;
        }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2em;
        }

        .quick-action-card,
        .quick-action-card-form {
            position: relative;
        }

        .quick-action-card-form {
            margin: 0;
            padding: 0;
            border: none;
            background: none;
        }

        .quick-action-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5em;
            background: linear-gradient(135deg, rgba(34, 116, 165, 0.05) 0%, rgba(255, 149, 5, 0.02) 100%);
            border: 2px solid rgba(34, 116, 165, 0.15);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 140px;
            gap: 0.6em;
            aspect-ratio: 1;
        }

        .quick-action-card:hover {
            background: linear-gradient(135deg, rgba(34, 116, 165, 0.1) 0%, rgba(255, 149, 5, 0.05) 100%);
            border-color: var(--primary-blue);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(34, 116, 165, 0.15);
        }

        .action-icon {
            font-size: 2.2em;
            line-height: 1;
        }

        .quick-action-card h3 {
            margin: 0;
            color: var(--primary-blue-dark);
            font-size: 1em;
            font-weight: 600;
            text-align: center;
        }

        .quick-action-card p {
            margin: 0;
            color: #666;
            font-size: 0.85em;
            text-align: center;
            line-height: 1.4;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .landing-grid {
                grid-template-columns: 1fr;
                gap: 1.2em;
                margin-bottom: 1.5em;
            }

            .quick-actions-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1em;
            }

            .quick-action-card {
                min-height: 120px;
                padding: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .quick-actions-grid {
                grid-template-columns: 1fr;
            }

            .quick-action-card {
                min-height: 100px;
                aspect-ratio: auto;
            }
        }
    </style>
</body>
</html>
