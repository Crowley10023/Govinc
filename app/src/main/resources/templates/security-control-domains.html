<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Security Control Domains List</title>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" href="/style.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-body {
            margin: 15px 0;
            font-size: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-close {
            background-color: #007bff;
            color: white;
        }

        .btn-close:hover {
            background-color: #0056b3;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid;
            border-radius: 4px;
        }

        .icon-success {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .icon-error {
            font-size: 24px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        table th, table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        table tr:hover {
            background-color: #f9f9f9;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons a, .action-buttons button {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .action-buttons a {
            background-color: #007bff;
            color: white;
        }

        .action-buttons a:hover {
            background-color: #0056b3;
        }

        .action-buttons button {
            background-color: #dc3545;
            color: white;
        }

        .action-buttons button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1>Security Control Domains</h1>
    <a href="/security-control-domain/create" class="btn-primary">Create New Security Control Domain</a>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="domain : ${domains}">
                <td th:text="${domain.id}"></td>
                <td th:text="${domain.name}"></td>
                <td th:text="${domain.description}"></td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{'/security-control-domain/edit'(id=${domain.id})}">Edit</a>
                        <button type="button" 
                                class="btn-delete btn-delete-trigger"
                                th:data-id="${domain.id}"
                                th:data-name="${domain.name}">
                            Delete
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/">Back to main</a>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Confirm Deletion</div>
        <div class="modal-body">
            <p>Are you sure you want to delete <strong id="domainName"></strong>?</p>
            <p style="color: #666; font-size: 14px;">This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button type="button" class="btn-delete" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- Result Modal -->
<div id="resultModal" class="modal">
    <div class="modal-content">
        <div id="resultIcon" class="icon-success">✓</div>
        <div class="modal-header" id="resultTitle">Success</div>
        <div class="modal-body" id="resultMessage"></div>
        <div class="modal-footer">
            <button type="button" class="btn-close" onclick="closeResultModal()">Close</button>
        </div>
    </div>
</div>

<script>
    let pendingDeleteId = null;

    // Initialize delete buttons
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.btn-delete-trigger').forEach(button => {
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const name = this.getAttribute('data-name');
                openDeleteModal(id, name);
            });
        });
    });

    function openDeleteModal(id, name) {
        pendingDeleteId = id;
        document.getElementById('domainName').textContent = name;
        document.getElementById('deleteModal').classList.add('show');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('show');
        pendingDeleteId = null;
    }

    function confirmDelete() {
        if (!pendingDeleteId) return;

        // Close confirmation modal
        closeDeleteModal();

        // Get CSRF token from meta tag
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // Send delete request
        fetch('/security-control-domain/delete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: 'id=' + encodeURIComponent(pendingDeleteId)
        })
        .then(response => {
            if (response.ok) {
                return response.text();
            } else {
                throw new Error('Delete failed with status ' + response.status);
            }
        })
        .then(data => {
            showResultModal(true, 'Deletion Successful', 'The security control domain has been deleted successfully.', true);
        })
        .catch(error => {
            console.error('Error:', error);
            showResultModal(false, 'Deletion Failed', 'An error occurred while deleting the domain. Please try again.', false);
        });
    }

    function showResultModal(success, title, message, shouldReload) {
        const resultModal = document.getElementById('resultModal');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const modalContent = resultModal.querySelector('.modal-content');

        if (success) {
            resultIcon.textContent = '✓';
            resultIcon.style.color = '#28a745';
            modalContent.classList.remove('alert-error');
            modalContent.classList.add('alert-success');
        } else {
            resultIcon.textContent = '✕';
            resultIcon.style.color = '#dc3545';
            modalContent.classList.remove('alert-success');
            modalContent.classList.add('alert-error');
        }

        resultTitle.textContent = title;
        resultMessage.textContent = message;
        resultModal.classList.add('show');

        // Auto-reload on success
        if (success && shouldReload) {
            setTimeout(() => {
                location.reload();
            }, 1500);
        }
    }

    function closeResultModal() {
        document.getElementById('resultModal').classList.remove('show');
    }

    // Close modals when clicking outside of them
    window.onclick = function(event) {
        const deleteModal = document.getElementById('deleteModal');
        const resultModal = document.getElementById('resultModal');
        
        if (event.target === deleteModal) {
            closeDeleteModal();
        }
        if (event.target === resultModal) {
            closeResultModal();
        }
    }
</script>
</body>
</html>
