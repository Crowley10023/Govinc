<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Security Control Domains List</title>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1>Security Control Domains</h1>
    <a href="/security-control-domain/create" class="btn-action">Create New Security Control Domain</a>
    
    <table class="table card" id="domainsTable">
        <thead>
            <tr>
                <th class="sortable-th" data-col="0">ID<span class="sort-arrow"></span></th>
                <th class="sortable-th" data-col="1">Name<span class="sort-arrow"></span></th>
                <th class="sortable-th" data-col="2">Description<span class="sort-arrow"></span></th>
                <th>Actions</th>
            </tr>
            <tr class="filter-row">
                <th><input type="text" class="col-filter" data-col="0" placeholder="Filter ID…" style="width:100%;box-sizing:border-box;font-weight:normal;font-size:0.82em;padding:0.2em 0.4em;"></th>
                <th><input type="text" class="col-filter" data-col="1" placeholder="Filter name…" style="width:100%;box-sizing:border-box;font-weight:normal;font-size:0.82em;padding:0.2em 0.4em;"></th>
                <th><input type="text" class="col-filter" data-col="2" placeholder="Filter description…" style="width:100%;box-sizing:border-box;font-weight:normal;font-size:0.82em;padding:0.2em 0.4em;"></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="domain : ${domains}">
                <td th:text="${domain.id}"></td>
                <td th:text="${domain.name}"></td>
                <td th:text="${domain.description}"></td>
                <td>
                    <div class="scd-action-buttons">
                        <a th:href="@{'/security-control-domain/edit'(id=${domain.id})}" class="btn-edit">Edit</a>
                        <button type="button" 
                            class="btn-danger btn-delete-trigger"
                                th:data-id="${domain.id}"
                                th:data-name="${domain.name}"
                                onclick="handleDeleteClick(event)">
                            Delete
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/" class="back-link">Back to main</a>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-bg">
    <div class="modal-popup-confirmation">
        <h3>Confirm Deletion</h3>
        <p>Are you sure you want to delete <strong id="domainName"></strong>?</p>
        <p class="text-muted text-sm">This action cannot be undone.</p>
        <div class="modal-btn-row">
            <button type="button" class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button type="button" class="btn-danger" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- Result Modal -->
<div id="resultModal" class="modal-bg">
    <div class="modal-popup-confirmation" id="resultModalContent">
        <p id="resultIcon" style="font-size:1.6em;margin:0 0 0.4em">OK</p>
        <h3 id="resultTitle">Success</h3>
        <p id="resultMessage"></p>
        <div class="modal-btn-row">
            <button type="button" class="btn-action" onclick="closeResultModal()">Close</button>
        </div>
    </div>
</div>

<script>
    let pendingDeleteId = null;

    function handleDeleteClick(event) {
        const button = event.target;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        openDeleteModal(id, name);
    }

    function openDeleteModal(id, name) {
        pendingDeleteId = id;
        document.getElementById('domainName').textContent = name;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
        pendingDeleteId = null;
    }

    function confirmDelete() {
        if (!pendingDeleteId) {
            showResultModal(false, 'Deletion Failed', 'Invalid domain ID. Please try again.', false);
            return;
        }

        // Store the ID before closing modal (important!)
        const idToDelete = pendingDeleteId;

        // Close confirmation modal
        closeDeleteModal();

        // Get CSRF token from meta tag
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // Send delete request with numeric id
        const trimmedId = String(idToDelete).trim();
        const deleteId = Number(trimmedId);
        
        if (isNaN(deleteId) || deleteId <= 0) {
            showResultModal(false, 'Deletion Failed', 'Invalid domain ID. Please try again.', false);
            return;
        }

        const body = 'id=' + deleteId;

        fetch('/security-control-domain/delete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: body
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('Delete failed with status ' + response.status);
            }
        })
        .then(data => {
            if (data.success) {
                showResultModal(true, 'Deletion Successful', 'The security control domain has been deleted successfully.', true);
            } else {
                showResultModal(false, data.title || 'Deletion Failed', data.message || 'An error occurred while deleting the domain.', false);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showResultModal(false, 'Deletion Failed', 'An error occurred while deleting the domain. Please try again.', false);
        });
    }

    function showResultModal(success, title, message, shouldReload) {
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultModalContent = document.getElementById('resultModalContent');

        resultIcon.textContent = success ? '\u2714' : '\u2716';
        resultIcon.style.color = success ? 'var(--success-green)' : 'var(--error-red)';
        resultTitle.textContent = title;
        resultMessage.textContent = message;
        document.getElementById('resultModal').style.display = 'flex';

        if (success && shouldReload) {
            setTimeout(() => { location.reload(); }, 1500);
        }
    }

    function closeResultModal() {
        document.getElementById('resultModal').style.display = 'none';
    }

    // Column filter inputs
    document.querySelectorAll('#domainsTable .col-filter').forEach(function(inp) {
        inp.addEventListener('input', function() {
            var val = this.value.trim().toLowerCase();
            var col = parseInt(this.getAttribute('data-col'));
            document.querySelectorAll('#domainsTable tbody tr').forEach(function(row) {
                row.style.display = row.children[col].textContent.trim().toLowerCase().includes(val) ? '' : 'none';
            });
        });
    });

    // Sortable column headers
    (function() {
        var sortState = { col: -1, dir: 0 };
        var ths = document.querySelectorAll('#domainsTable thead .sortable-th');
        ths.forEach(function(th) {
            th.addEventListener('click', function() {
                var col = parseInt(this.getAttribute('data-col'));
                if (sortState.col === col) {
                    sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
                } else {
                    sortState.col = col;
                    sortState.dir = 1;
                }
                ths.forEach(function(h) { h.classList.remove('sort-asc', 'sort-desc'); });
                if (sortState.dir === 1) this.classList.add('sort-asc');
                else if (sortState.dir === -1) this.classList.add('sort-desc');
                if (sortState.dir !== 0) {
                    var tbody = document.querySelector('#domainsTable tbody');
                    var rows = Array.from(tbody.querySelectorAll('tr'));
                    var dir = sortState.dir;
                    rows.sort(function(a, b) {
                        var av = a.children[col].textContent.trim().toLowerCase();
                        var bv = b.children[col].textContent.trim().toLowerCase();
                        return av.localeCompare(bv) * dir;
                    });
                    rows.forEach(function(r) { tbody.appendChild(r); });
                }
            });
        });
    })();

    // Close modals when clicking outside of them
    window.onclick = function(event) {
        const deleteModal = document.getElementById('deleteModal');
        const resultModal = document.getElementById('resultModal');
        
        if (event.target === deleteModal) {
            closeDeleteModal();
        }
        if (event.target === resultModal) {
            closeResultModal();
        }
    }
</script>
</body>
</html>
