<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Assessment URLs</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block></head>

<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <h1 class="page-title">Assessment URLs</h1>
        <section>
            <div style="margin-bottom:1em;display:flex;align-items:center;gap:1em;flex-wrap:wrap;">
                <form th:action="@{'/assessment-direct/urls/check-expiration'}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-action">Check Expiration</button>
                </form>
                <span class="text-muted text-sm">Immediately removes all URLs that have passed their expiration date.</span>
                <label for="catalogFilter" style="margin-left:auto;font-weight:600;">Filter by Catalog:</label>
                <select id="catalogFilter" onchange="filterByCatalog()" style="min-width:180px;">
                    <option value="">All catalogs</option>
                </select>
            </div>
            <table class="table card" id="urlsTable">
                <thead>
                    <tr>
                        <th class="sortable-th" data-col="0">Obfuscated URL<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="1">Assessment Name<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="2">Security Catalog<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="3">Remaining Days<span class="sort-arrow"></span></th>
                        <th class="sortable-th" data-col="4">Expiration Date<span class="sort-arrow"></span></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="url : ${urls}"
                        th:data-url-id="${url.id}"
                        th:data-url-name="${url.assessment != null ? url.assessment.name : ''}"
                        th:data-catalog-id="${url.assessment != null and url.assessment.securityCatalog != null ? url.assessment.securityCatalog.id : ''}"
                        th:data-catalog-name="${url.assessment != null and url.assessment.securityCatalog != null ? url.assessment.securityCatalog.name : ''}">
                        <td>
                            <a th:href="@{'/assessment-direct/' + ${url.url}}" th:text="${url.url}" target="_blank"
                                style="display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;" th:title="${url.url}"></a>
                        </td>
                        <td>
                            <a th:if="${url.assessment != null}" th:href="@{'/assessment/' + ${url.assessment.id}}"
                                th:text="${url.assessment.name}"></a>
                            <span th:if="${url.assessment == null}">—</span>
                        </td>
                        <td th:text="${url.assessment != null and url.assessment.securityCatalog != null ? url.assessment.securityCatalog.name : '—'}"></td>
                        <td th:text="${url.assessment != null and url.assessment.urlExpirationDate != null ? url.assessment.daysUntilUrlExpiration : 'N/A'}"
                            th:classappend="${url.assessment != null and url.assessment.urlExpirationDate != null and url.assessment.daysUntilUrlExpiration <= 3} ? 'text-danger' : ''"></td>
                        <td th:text="${url.assessment != null and url.assessment.urlExpirationDate != null ? #temporals.format(url.assessment.urlExpirationDate, 'dd MMM yyyy') : 'N/A'}"></td>
                        <td>
                            <form th:action="@{'/assessment-direct/urls/' + ${url.id} + '/prolong'}" method="post"
                                style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn-submit">Prolong</button>
                            </form>
                            <button type="button" class="btn-danger"
                                th:data-id="${url.id}"
                                th:data-name="${url.assessment != null ? url.assessment.name : 'this entry'}"
                                onclick="openUrlDeleteModal(this)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="urlDeleteModal" class="modal-bg" style="display:none;">
        <div class="modal-popup-confirmation">
            <h3>Delete Assessment URL?</h3>
            <p>Delete the URL for <strong id="urlDeleteName"></strong>? This cannot be undone.</p>
            <div class="modal-btn-row">
                <button type="button" class="btn-cancel" onclick="closeUrlDeleteModal()">Cancel</button>
                <form id="urlDeleteForm" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openUrlDeleteModal(btn) {
            document.getElementById('urlDeleteName').textContent = btn.getAttribute('data-name');
            document.getElementById('urlDeleteForm').action = '/assessment-direct/urls/' + btn.getAttribute('data-id') + '/delete';
            document.getElementById('urlDeleteModal').style.display = 'flex';
        }
        function closeUrlDeleteModal() {
            document.getElementById('urlDeleteModal').style.display = 'none';
        }
        document.getElementById('urlDeleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeUrlDeleteModal();
        });

        // Sortable columns
        (function() {
            var sortState = { col: -1, dir: 0 }; // dir: 0=none, 1=asc, -1=desc
            var ths = document.querySelectorAll('#urlsTable thead .sortable-th');
            ths.forEach(function(th) {
                th.addEventListener('click', function() {
                    var col = parseInt(this.getAttribute('data-col'));
                    if (sortState.col === col) {
                        sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
                    } else {
                        sortState.col = col;
                        sortState.dir = 1;
                    }
                    ths.forEach(function(h) { h.classList.remove('sort-asc','sort-desc'); });
                    if (sortState.dir === 1) this.classList.add('sort-asc');
                    else if (sortState.dir === -1) this.classList.add('sort-desc');
                    sortTable(col, sortState.dir);
                });
            });

            function sortTable(col, dir) {
                var tbody = document.querySelector('#urlsTable tbody');
                var rows = Array.from(tbody.querySelectorAll('tr:not([style*="display: none"]):not([style*="display:none"])'));
                if (dir === 0) {
                    rows.sort(function(a, b) { return a.rowIndex - b.rowIndex; });
                } else {
                    rows.sort(function(a, b) {
                        var av = a.children[col].textContent.trim().toLowerCase();
                        var bv = b.children[col].textContent.trim().toLowerCase();
                        if (col === 3) { // Remaining Days — numeric sort
                            var an = parseFloat(av), bn = parseFloat(bv);
                            if (!isNaN(an) && !isNaN(bn)) return (an - bn) * dir;
                        }
                        if (col === 4) { // Expiration Date — use data-iso or text
                            var ad = a.children[col].getAttribute('data-iso') || av;
                            var bd = b.children[col].getAttribute('data-iso') || bv;
                            return ad.localeCompare(bd) * dir;
                        }
                        return av.localeCompare(bv) * dir;
                    });
                }
                rows.forEach(function(r) { tbody.appendChild(r); });
            }
        })();

        // Catalog filter — populate dropdown and apply filtering
        (function() {
            var rows = Array.from(document.querySelectorAll('#urlsTable tbody tr'));
            var catalogs = {};
            rows.forEach(function(row) {
                var id = row.getAttribute('data-catalog-id') || '';
                var name = row.getAttribute('data-catalog-name') || '';
                if (id && !catalogs[id]) catalogs[id] = name;
            });
            var select = document.getElementById('catalogFilter');
            Object.keys(catalogs).sort(function(a, b) {
                return (catalogs[a] || '').localeCompare(catalogs[b] || '');
            }).forEach(function(id) {
                var opt = document.createElement('option');
                opt.value = id;
                opt.textContent = catalogs[id] || '(unknown)';
                select.appendChild(opt);
            });
        })();

        function filterByCatalog() {
            var selected = document.getElementById('catalogFilter').value;
            document.querySelectorAll('#urlsTable tbody tr').forEach(function(row) {
                if (!selected || row.getAttribute('data-catalog-id') === selected) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>

</html>
