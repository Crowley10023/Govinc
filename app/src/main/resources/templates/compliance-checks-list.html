<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compliance Checks Management</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block></head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1 class="page-title">Compliance Checks</h1>
    <div class="mb-2em">
        <a href="/compliance/create" class="btn-action">Create New Compliance Check</a>
    </div>
    <table class="table card">
        <thead>
            <tr>
                <th>Name</th>
                <th>Catalog</th>
                <th>Description</th>
                <th>Thresholds</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="check : ${checks}">
                <td th:text="${check.name}"></td>
                <td th:text="${check.securityCatalog?.name}"></td>
                <td th:text="${check.description}"></td>
                <td>
                    <ul>
                        <li th:each="threshold : ${check.thresholds}" th:text="${threshold.ruleDescription} + ' (' + threshold.type + ' ' + threshold.value + ')'">
                        </li>
                    </ul>
                </td>
                <td>
                    <a th:href="@{'/compliance/edit/' + ${check.id}}" class="btn-edit">Edit</a>
                    <button type="button" class="btn-danger"
                        th:data-id="${check.id}"
                        th:data-name="${check.name}"
                        onclick="openDeleteModal(this)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Delete Confirmation Modal -->
<div id="complianceDeleteModal" class="modal-bg" style="display:none;">
    <div class="modal-popup-confirmation">
        <h3>Delete Compliance Check?</h3>
        <p>Are you sure you want to delete <strong id="complianceDeleteName"></strong>?</p>
        <p>This action cannot be undone.</p>
        <div class="modal-btn-row">
            <button type="button" class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <form id="complianceDeleteForm" method="post" style="display:inline;">
                <button type="submit" class="btn-danger">Delete</button>
            </form>
        </div>
    </div>
</div>

<script>
    function openDeleteModal(btn) {
        var id = btn.getAttribute('data-id');
        var name = btn.getAttribute('data-name');
        document.getElementById('complianceDeleteName').textContent = name;
        document.getElementById('complianceDeleteForm').action = '/compliance/delete/' + id;
        document.getElementById('complianceDeleteModal').style.display = 'flex';
    }
    function closeDeleteModal() {
        document.getElementById('complianceDeleteModal').style.display = 'none';
    }
</script>
</body>
</html>
