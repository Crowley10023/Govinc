<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Maturity Model List</title>
    <meta charset="UTF-8">
    <th:block th:replace="~{navigation :: navHead}"></th:block></head>
<body>
    <div th:replace="~{navigation :: mainNav}"></div>
    <div class="container">
        <h1 class="page-title">Maturity Models</h1>
        <a href="/maturitymodel/edit" class="btn-action">Create New Maturity Model</a>
        <div style="margin-top:1.5em;">
            <table class="table card">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Security Catalog</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="model : ${maturityModels}">
                    <td th:text="${model.name}"></td>
                    <td th:text="${model.description}"></td>
                    <td th:text="${model.securityCatalog != null ? model.securityCatalog.name : '-'}"></td>
                    <td><a th:href="@{'/maturitymodel/edit/' + ${model.id}}" class="btn-edit">Edit</a></td>
                    <td>
                        <button type="button" class="btn-danger"
                            th:data-id="${model.id}"
                            th:data-name="${model.name}"
                            onclick="openDeleteModal(this)">Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="maturityDeleteModal" class="modal-bg" style="display:none;">
        <div class="modal-popup-confirmation">
            <h3>Delete Maturity Model?</h3>
            <p>Are you sure you want to delete <strong id="maturityDeleteName"></strong>?</p>
            <p>This action cannot be undone.</p>
            <div class="modal-btn-row">
                <button type="button" class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <form id="maturityDeleteForm" method="post" style="display:inline;">
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openDeleteModal(btn) {
            var id = btn.getAttribute('data-id');
            var name = btn.getAttribute('data-name');
            document.getElementById('maturityDeleteName').textContent = name;
            document.getElementById('maturityDeleteForm').action = '/maturitymodel/delete/' + id;
            document.getElementById('maturityDeleteModal').style.display = 'flex';
        }
        function closeDeleteModal() {
            document.getElementById('maturityDeleteModal').style.display = 'none';
        }
    </script>
</body>
</html>
