<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Edit Security Control Domain</title>
    <meta charset="UTF-8"></head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1 th:text="${domain.id != null} ? 'Edit Security Control Domain' : 'Create Security Control Domain'"></h1>
    <div class="entity-edit-frame">
        <form th:action="@{/security-control-domain/edit}" th:object="${domain}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" th:field="*{name}" id="name" required />
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea th:field="*{description}" id="description"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-submit">Save</button>
                <a th:href="@{/security-control-domain/list}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
