<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Org Unit List</title>
    <th:block th:replace="~{navigation :: navHead}"></th:block>
</head>
<body>
<div th:replace="~{navigation :: mainNav}"></div>
<div class="container">
    <h1>Organization Units</h1>
    <a th:href="@{'/orgunits/create'}" class="btn-action">Create New Org Unit</a>
    
    <div th:if="${#lists.isEmpty(orgUnits)}" class="empty-state">
        <p>No organization units found.</p>
        <a th:href="@{'/orgunits/create'}">Create the first one</a>
    </div>
    
    <div th:if="${not #lists.isEmpty(orgUnits)}">
        <table class="table card">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Team Leader</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="orgUnit : ${orgUnits}">
                    <td th:text="${orgUnit.name}"></td>
                    <td th:text="${orgUnit.id}"></td>
                    <td th:text="${orgUnit.leader != null ? orgUnit.leader.name : '—'}"></td>
                    <td>
                        <a th:href="@{'/orgunits/edit/' + ${orgUnit.id}}" class="btn-edit">Edit</a>
                        <a th:href="@{'/orgunits/tree-view/' + ${orgUnit.id}}" class="btn-action">Tree View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
