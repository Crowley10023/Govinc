# ================= Dynamic Authentication Configuration =================
# This application supports FULLY DYNAMIC authentication provider configuration.
# The app will always start successfully with form authentication as fallback.
# Configure OAuth2 providers ONLY via the web interface at /admin/auth-config
# 
# IMPORTANT: All OAuth2/Security configurations have been moved to dynamic configuration.
# Do NOT add spring.security.oauth2.* properties here as they will interfere with
# dynamic configuration.

# Ensure https is Azure Redirect
server.forward-headers-strategy=framework

app.version=@app.version@

# ================= Database settings =================
spring.datasource.url=jdbc:mariadb://govinc:3306/govinc
spring.datasource.username=govinc
spring.datasource.password=xxxxx
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
app.database.backup-dir=backups/database

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -------------- LOCAL AUTHENTICATION USERS --------------
# Configure local users for form-based authentication
# Format: users.<username>=<password>[,<email>]
users.admin=admin,admin@example.com

# =====================================================================
# SESSION CONFIGURATION FOR OAUTH2
# =====================================================================
# Session cookie settings - ensure JSESSIONID is sent to OAuth2 providers
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# =====================================================================
# APPLICATION CONFIGURATION
# =====================================================================
server.port=8080

# Allow large multipart uploads (database backup files can be several MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Disable OAuth2 Auto Configuration to prevent conflicts with dynamic config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Ensure we use standard servlet session tracking (required for OAuth2 state parameter storage)
spring.session.store-type=none

# Enable debug logging for authentication and OAuth2 flow tracing
logging.level.com.govinc.configuration=DEBUG
logging.level.com.govinc.service.AuthConfigService=WARN
logging.level.com.govinc.controller.LoginController=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.security.web=WARN
logging.level.org.springframework.boot.autoconfigure.security=WARN
# Suppress expected IOException from SSE client disconnections (browser navigation, tab close)
logging.level.org.springframework.web.servlet.mvc.method.annotation=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.apache.catalina.connector=ERROR

# Production Mode Flag (set to true during production deployment)
app.production=false
