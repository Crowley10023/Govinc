# ================= Dynamic Authentication Configuration =================
# This application supports FULLY DYNAMIC authentication provider configuration.
# The app will always start successfully with form authentication as fallback.
# Configure OAuth2 providers ONLY via the web interface at /admin/auth-config
# 
# IMPORTANT: All OAuth2/Security configurations have been moved to dynamic configuration.
# Do NOT add spring.security.oauth2.* properties here as they will interfere with
# dynamic configuration.

# Option 1 – use the framework’s ForwardedHeaderFilter
server.forward-headers-strategy=framework


# ================= Database settings =================
spring.datasource.url=jdbc:mariadb://govinc:3306/govinc
spring.datasource.username=govinc
spring.datasource.password=xxxxx
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -------------- LOCAL AUTHENTICATION USERS --------------
# Configure local users for form-based authentication
# Format: users.<username>=<password>[,<email>]
users.admin=admin,admin@example.com
users.testuser=test123,test@example.com
# To add more users, add lines like:
# users.<username>=<password>[,<email>]

# =====================================================================
# APPLICATION CONFIGURATION
# =====================================================================
server.port=8080

# Disable OAuth2 Auto Configuration to prevent conflicts with dynamic config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Enable debug logging for authentication (can be disabled in production)
logging.level.com.govinc.configuration=INFO
logging.level.com.govinc.service.AuthConfigService=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.autoconfigure.security=WARN