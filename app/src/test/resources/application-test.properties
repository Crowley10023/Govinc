# ================= Test Configuration =================
# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable OAuth2 auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Local test user
users.admin=admin,admin@example.com

# Session
spring.session.store-type=none
server.servlet.session.timeout=30m

# Disable production mode
app.production=false

# Logging - suppress all framework noise during tests
logging.level.root=OFF
logging.level.com.govinc=OFF
logging.level.org.springframework=OFF
logging.level.org.springframework.security=OFF
logging.level.org.springframework.boot=OFF
logging.level.org.springframework.test=OFF
logging.level.org.hibernate=OFF
logging.level.org.thymeleaf=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.org.apache.catalina=OFF
logging.level.org.apache.tomcat=OFF
